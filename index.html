/* ============================================================
   AVATAR CHIP RENDER + DRAG ENGINE (worker slots, cap 3)
   ============================================================ */
function buildAvatarChip(w, opts){
  opts = opts || {};
  const bulkMode = state.bulkSelectMode && !opts.assignedInstance;
  const isBulkSelected = bulkMode && state.bulkSelectedIds.includes(w.id);
  const chip = document.createElement('div');
  chip.className = 'avatar-chip' + (opts.tiny?' tiny':'') + (opts.assignedInstance?' assigned-instance':'') + (opts.dimmed?' chip-dimmed':'') + (opts.isRelief?' chip-relief':'') + (isBulkSelected?' bulk-selected':'');
  chip.dataset.workerId = w.id;
  if(state.selectedChip===w.id) chip.classList.add('selected');
  const rbaOver = rbaOverSet.has(w.id);
  if(rbaOver) chip.classList.add('rba-over');
  const flag = workerFlag(w);
  if(flag==='pregnant')    chip.classList.add('is-preg');
  if(flag==='office')      chip.classList.add('is-office');
  if(flag==='healthissue') chip.classList.add('is-health');
  const ring = BREAK_GROUPS[w.breakGroup] ? BREAK_GROUPS[w.breakGroup].color : '#999';
  chip.innerHTML = `
    ${bulkMode ? `<span class="bulk-check">${isBulkSelected?'✓':''}</span>` : ''}
    <span class="avatar-circle" style="background:${w.color};border-color:${ring};">${avatarSvg(w.avatar)}</span>
    <span class="aname">${w.name}</span>${flag!=='none' ? `<span class="wflag" title="${flagLabel(flag)}">${WORKER_FLAGS[flag].emoji}</span>` : ''}
    ${(!opts.assignedInstance && w.slots.length>0) ? `<span class="acount">×${w.slots.length}</span>` : ''}
    ${opts.dimmed ? `<span class="chip-tag">${opts.tagText || T('พัก','Break')}</span>` : ''}
    ${(opts.assignedInstance && opts.slotId && isSharedWorker(w)) ? `<span class="share-frac" title="${T('คนคนนี้ดูแล '+productionSlotsOf(w).length+' ตำแหน่งพร้อมกัน: ','This person covers '+productionSlotsOf(w).length+' positions at once: ')+productionSlotsOf(w).map(labelForSlot).join(', ')}">${sharePercentLabel(w, opts.slotId)}</span>` : ''}
    ${opts.isRelief ? `<span class="chip-tag relief">${T('สลับเบรก','Relief')}</span>` : ''}
    ${rbaOver ? `<span class="rba-chip-flag" title="${T('ชั่วโมงทำงานเกินเกณฑ์ RBA','Working hours exceed the RBA limit')}">⚠</span>` : ''}
    ${(!opts.assignedInstance && !bulkMode) ? `<button type="button" class="chip-settings-btn" title="${T('ตั้งชื่อ/กลุ่มพัก','Set name/break group')}">⚙</button>` : ''}
  `;
  if(opts.assignedInstance && isSharedWorker(w)){
    chip.addEventListener('pointerenter', ()=>highlightSharedWorker(w.id, true));
    chip.addEventListener('pointerleave', ()=>highlightSharedWorker(w.id, false));
  }
  if(opts.assignedInstance){
    if(opts.isRelief){
      chip.title = T('กำลังสลับเบรกให้เครื่องนี้ — คลิกเพื่อดูรายละเอียด','Currently on relief duty here — click for details');
      chip.addEventListener('click', (e)=>{ e.stopPropagation(); openWorkerPanel(w.id); });
    } else {
      // Must be DRAGGED out to unassign — a plain click only opens the worker's
      // details, so people no longer vanish from a card by mis-clicking.
      chip.dataset.originSlot = opts.slotId || '';
      chip.title = T('ลากออกจากการ์ดนี้เพื่อถอนออกจากตำแหน่ง (คลิกเพื่อดูรายละเอียด)','Drag out of this card to remove from the position (click for details)');
      chip.addEventListener('pointerdown', onAvatarPointerDown);
    }
  } else if(bulkMode){
    chip.title = T('คลิกเพื่อเลือก/ยกเลิกเลือก','Click to select/deselect');
    chip.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = state.bulkSelectedIds.indexOf(w.id);
      if(idx>=0) state.bulkSelectedIds.splice(idx,1); else state.bulkSelectedIds.push(w.id);
      renderFloorTab();
    });
  } else {
    chip.addEventListener('pointerdown', onAvatarPointerDown);
    const gearBtn = chip.querySelector('.chip-settings-btn');
    gearBtn.addEventListener('pointerdown', e=>e.stopPropagation());
    gearBtn.addEventListener('click', (e)=>{ e.stopPropagation(); e.preventDefault(); openWorkerPanel(w.id); });
  }
  return chip;
}
function renderRosterInto(container){
  container.innerHTML='';
  let workers = state.workers.slice();
  // department filter
  if(state.rosterFilterDept && state.rosterFilterDept!=='all'){
    workers = workers.filter(w=>{
      if(state.rosterFilterDept==='pregnant') return isPregnant(w);
      if(state.rosterFilterDept==='office')   return isOfficeStaff(w);
      if(state.rosterFilterDept==='healthissue') return hasHealthIssue(w);
      const lt = workerLaborType(w);
      if(state.rosterFilterDept==='unassigned') return !lt;
      return lt===state.rosterFilterDept;
    });
  }
  if(state.rosterFilterTeam && state.rosterFilterTeam!=='all'){
    workers = workers.filter(w=>workerMatchesTeamFilter(w, state.rosterFilterTeam));
  }
  workers.sort((a,b)=> (b.slots.length-a.slots.length) || a.id.localeCompare(b.id));

  const groupKeysToShow = state.rosterFilterGroup && state.rosterFilterGroup!=='all'
    ? [state.rosterFilterGroup]
    : [...BREAK_GROUP_ORDER, 'none'];

  groupKeysToShow.forEach(gk=>{
    const groupWorkers = workers.filter(w=> gk==='none' ? !w.breakGroup : w.breakGroup===gk);
    if(groupWorkers.length===0) return;
    const section = document.createElement('div');
    section.className = 'roster-group-section';
    const header = document.createElement('div');
    header.className = 'roster-group-header';
    if(gk==='none'){
      header.innerHTML = `<span class="rg-dot" style="background:#B0B6BB;"></span>${T('ไม่ระบุกลุ่มพัก','No break group')} <span class="rg-count">${groupWorkers.length}</span>`;
    } else {
      const grp = BREAK_GROUPS[gk];
      header.innerHTML = `<span class="rg-dot" style="background:${grp.color};"></span>${breakGroupLabel(gk)} <span class="rg-count">${groupWorkers.length}</span>`;
    }
    section.appendChild(header);
    const grid = document.createElement('div');
    grid.className = 'slot-drop roster-group-grid';
    groupWorkers.forEach(w=>{
      const chip = buildAvatarChip(w,{});
      const lt = workerLaborType(w);
      const deptTag = document.createElement('span');
      deptTag.className = 'chip-dept-tag '+(lt||'none');
      deptTag.textContent = lt==='direct' ? T('D','D') : (lt==='indirect' ? T('I','I') : T('—','—'));
      deptTag.title = lt==='direct' ? T('Direct','Direct') : (lt==='indirect' ? T('Indirect','Indirect') : T('ยังไม่จัดตำแหน่ง','Unassigned'));
      chip.appendChild(deptTag);
      grid.appendChild(chip);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
  if(container.children.length===0){
    container.innerHTML = `<div class="hint" style="padding:10px;">${T('ไม่มีพนักงานตรงตามตัวกรอง','No employees match the filter')}</div>`;
  }
}
function renderAssignedInto(container, slotId, tiny, shift){
  container.innerHTML='';
  const g = breakOnGroup();
  let workers = workersCoveringSlot(slotId);
  if(shift){ workers = workers.filter(w=> effectiveShift(w, slotId, state.weekStart)===shift); }
  workers.forEach(w=>{
    const onBreak = g && w.breakGroup===g;
    const leaving = !onBreak && isLeavingForRelief(w, slotId);
    container.appendChild(buildAvatarChip(w,{
      tiny:tiny!==false, assignedInstance:true, slotId,
      dimmed: onBreak || leaving,
      tagText: onBreak ? T('พัก','Break') : (leaving ? T('ไปแทนเบรก','Relieving') : null)
    }));
  });
  if(g && shift!=='night'){
    reliefsForGroup(g).forEach(r=>{
      if(r.to !== slotId) return;
      if(workers.some(w=>w.id===r.w.id)) return;
      container.appendChild(buildAvatarChip(r.w,{tiny:tiny!==false, assignedInstance:true, slotId, isRelief:true}));
    });
  }
}

let avDrag = null;
function onAvatarPointerDown(e){
  e.preventDefault();
  const chip = e.currentTarget;
  const hitCircle = !!e.target.closest('.avatar-circle');
  const originSlot = chip.dataset.originSlot || null;
  const originEl = originSlot ? chip.closest('[data-machine-drop],[data-support-drop]') : null;
  const originShift = originEl ? (originEl.dataset.shift || null) : null;
  avDrag = { workerId:chip.dataset.workerId, startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null,
             sourceEl:chip, hitCircle, originSlot, originShift };
  window.addEventListener('pointermove', onAvatarPointerMove);
  window.addEventListener('pointerup', onAvatarPointerUp, {once:true});
}
function onAvatarPointerMove(e){
  if(!avDrag) return;
  const dx=e.clientX-avDrag.startX, dy=e.clientY-avDrag.startY;
  if(!avDrag.moved && Math.hypot(dx,dy)>6){
    avDrag.moved = true;
    const ghost = avDrag.sourceEl.cloneNode(true);
    ghost.classList.add('chip-ghost-avatar');
    document.body.appendChild(ghost);
    avDrag.ghostEl = ghost;
    avDrag.sourceEl.classList.add('dragging');
  }
  if(avDrag.moved && avDrag.ghostEl){
    avDrag.ghostEl.style.left=e.clientX+'px';
    avDrag.ghostEl.style.top=e.clientY+'px';
    updateSlotHover(e.clientX,e.clientY,'[data-machine-drop],[data-support-drop],[data-jigslot-drop]');
    if(avDrag.originSlot){
      const poolWrap = document.getElementById('pool-tray-wrap');
      if(poolWrap){
        const hit = document.elementFromPoint(e.clientX,e.clientY);
        poolWrap.classList.toggle('pool-drop-hover', !!(hit && hit.closest('#pool-tray-wrap')));
      }
    }
  }
}
function findDropTargetAt(x,y){
  const el = document.elementFromPoint(x,y);
  if(!el) return null;
  // 1) exact drop zone under the cursor
  let target = el.closest('[data-machine-drop],[data-support-drop],[data-jigslot-drop]');
  if(target) return target;
  // 2) anywhere on a machine card -> its day slot (or its only slot)
  const mtile = el.closest('.machine-tile');
  if(mtile) return mtile.querySelector('[data-machine-drop]');
  // 3) anywhere on a support/team card -> its people slot
  const stile = el.closest('.support-tile');
  if(stile) return stile.querySelector('[data-support-drop]');
  return null;
}
function updateSlotHover(x,y,selector){
  document.querySelectorAll(selector).forEach(el=>el.classList.remove('dragover'));
  const target = findDropTargetAt(x,y);
  if(target) target.classList.add('dragover');
}

/* Re-render only the people (and status flags) inside the floor plan.
   A full renderFloorTab() would rebuild the canvas and visibly shift the layout. */
function refreshFloorAssignments(){
  refreshRbaSet();
  const tray = document.getElementById('roster-tray');
  if(tray) renderRosterInto(tray);
  document.querySelectorAll('[data-machine-drop]').forEach(el=>{
    renderAssignedInto(el, el.dataset.machineDrop, true, el.dataset.shift || undefined);
  });
  document.querySelectorAll('[data-support-drop]').forEach(el=>{
    renderAssignedInto(el, el.dataset.supportDrop, true, el.dataset.shift || undefined);
  });
  document.querySelectorAll('[data-jig-layer]').forEach(l=>renderJigLayerInto(l, l.dataset.jigLayer));
  document.querySelectorAll('[data-machine-tile-id]').forEach(tile=>{
    const id = tile.dataset.machineTileId;
    tile.classList.remove('status-ok','status-shared','status-critical','status-decommissioned');
    tile.classList.add('status-'+machineStatus(id));
    decorateTileWarnings(tile, id, 'machine');
    updateTileReqLine(tile, id);
  });
  document.querySelectorAll('[data-support-tile-id]').forEach(tile=>{
    const zid = tile.dataset.supportTileId;
    decorateTileWarnings(tile, zid, 'support');
    if(findZone(zid)) updateSupportReqLine(tile, zid);
  });
  updateFloorSummaryBar();
  updateFloorRbaBanner();
  updateBreakOverlays();
  growCanvasToContent();
  persistLocal();
  scheduleCloudSave();
}
function afterAssignmentChange(){
  if(state.activeTab === 'floor'){ refreshFloorAssignments(); }
  else { renderTabs(); }
}
function onAvatarPointerUp(e){
  window.removeEventListener('pointermove', onAvatarPointerMove);
  if(!avDrag) return;
  const ctx = avDrag; avDrag=null;
  if(ctx.ghostEl) ctx.ghostEl.remove();
  ctx.sourceEl && ctx.sourceEl.classList.remove('dragging');
  document.querySelectorAll('[data-machine-drop],[data-support-drop],[data-jigslot-drop]').forEach(el=>el.classList.remove('dragover'));
  const poolWrap = document.getElementById('pool-tray-wrap');
  if(poolWrap) poolWrap.classList.remove('pool-drop-hover');

  if(!ctx.moved){
    // A plain click never removes an assignment — it only opens the person's details.
    if(ctx.originSlot || ctx.hitCircle){ openWorkerPanel(ctx.workerId); return; }
    state.selectedChip = (state.selectedChip===ctx.workerId) ? null : ctx.workerId;
    if(state.activeTab==='floor'){
      document.querySelectorAll('.avatar-chip').forEach(c=>c.classList.toggle('selected', c.dataset.workerId===state.selectedChip));
    } else { renderTabs(); }
    return;
  }

  if(ctx.originSlot){
    // Dragging a chip that was already assigned somewhere: dropping on the
    // employee pool unassigns them; dropping on a different machine/team
    // moves that one assignment; dropping back on empty space changes nothing.
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const overPool = !!(hit && hit.closest('#pool-tray-wrap'));
    if(overPool){
      removeSlotFromWorker(ctx.workerId, ctx.originSlot);
      afterAssignmentChange();
      return;
    }
    const target = findDropTargetAt(e.clientX, e.clientY);
    if(target){
      const slotId = target.dataset.machineDrop || target.dataset.supportDrop || target.dataset.jigslotDrop;
      const shift = target.dataset.shift || null;
      if(slotId !== ctx.originSlot || shift !== ctx.originShift){
        removeSlotFromWorker(ctx.workerId, ctx.originSlot);
        const res = addSlotToWorker(ctx.workerId, slotId, target.dataset.shift);
        if(!reportAssignResult(res)){
          // destination refused — restore the original assignment, don't lose the person
          addSlotToWorker(ctx.workerId, ctx.originSlot, ctx.originShift || 'day');
        }
      }
    }
    afterAssignmentChange();
    return;
  }

  const target = findDropTargetAt(e.clientX, e.clientY);
  if(target){
    const slotId = target.dataset.machineDrop || target.dataset.supportDrop || target.dataset.jigslotDrop;
    reportAssignResult(addSlotToWorker(ctx.workerId, slotId, target.dataset.shift));
  }
  afterAssignmentChange();
}
function registerMachineDrop(el, machineId, shift){
  el.dataset.machineDrop = machineId;
  if(shift) el.dataset.shift = shift;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.avatar-chip')) return;
    if(state.selectedChip){ reportAssignResult(addSlotToWorker(state.selectedChip, machineId, shift)); state.selectedChip=null; afterAssignmentChange(); return; }
    openDetailPanel(machineId);
  });
}
function registerSupportDrop(el, zoneId, shift){
  el.dataset.supportDrop = zoneId;
  if(shift) el.dataset.shift = shift;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.avatar-chip')) return;
    if(state.selectedChip){ reportAssignResult(addSlotToWorker(state.selectedChip, zoneId, shift)); state.selectedChip=null; afterAssignmentChange(); }
  });
}


/* ============================================================
   JIG (Secondary Process) RENDER + DRAG ENGINE
   ============================================================ */
function jigPos(j){
  if(!j.pos || typeof j.pos.x!=='number' || typeof j.pos.y!=='number') j.pos = { x:0.5, y:0.78 };
  j.pos.x = Math.max(0.04, Math.min(0.96, j.pos.x));
  j.pos.y = Math.max(0.04, Math.min(0.96, j.pos.y));
  return j.pos;
}
function buildJigTile(j, free){
  const tile = document.createElement('div');
  tile.className = 'jig-tile' + (free ? ' free' : '');
  tile.dataset.jigId = j.id;
  tile.style.background = j.color;
  const statusColor = j.status==='fix' ? '#D71920' : '#2E7D52';
  const dot = document.createElement('span');
  dot.className = 'jstatus';
  dot.style.background = statusColor;
  dot.title = T('คลิกเพื่อตั้งค่า Jig นี้','Click to configure this Jig');
  tile.appendChild(dot);
  // editable label so the real machine name can be typed in
  const nameSpan = editableLabel(()=>j.name, v=>{ j.name = v; persistLocal(); scheduleCloudSave(); });
  nameSpan.classList.add('jname');
  nameSpan.title = T('คลิกเพื่อแก้ชื่อ (ใส่ชื่อเครื่องจริงได้)','Click to rename (type the real machine name)');
  tile.appendChild(nameSpan);
  if(free){
    const p = jigPos(j);
    tile.style.left = (p.x*100)+'%';
    tile.style.top  = (p.y*100)+'%';
    tile.style.transform = 'translate(-50%,-50%)';
    if(j.machineId){
      // people can be assigned to the jig itself
      const sid = jigSlotId(j.id);
      const need = jigReq(j.id);
      const eff = effectiveAssigned(sid);
      const cnt = document.createElement('span');
      cnt.className = 'jig-req' + (eff < need - 0.001 ? ' short' : '');
      cnt.textContent = '👤' + fmtReq(eff) + '/' + fmtReq(need);
      tile.appendChild(cnt);
      const drop = document.createElement('div');
      drop.className = 'slot-drop jig-people';
      tile.appendChild(drop);
      renderAssignedInto(drop, sid, true, 'day');
      registerJigSlotDrop(drop, j.id);
    }
  }
  if(state.selectedJig===j.id) tile.style.boxShadow = '0 0 0 3px rgba(215,25,32,.4)';
  tile.addEventListener('pointerdown', onJigPointerDown);
  tile.addEventListener('click', (e)=>{
    if(jigDrag && jigDrag.moved) return;
    e.stopPropagation();
    if(e.target.closest('.jig-people')) return;          // the people slot handles itself
    if(e.target.closest('.editable-label')) return;      // renaming

let jigDrag = null;
function onJigPointerDown(e){
  if(e.target.closest('input') || e.target.closest('.editable-label')) return;  // renaming
  if(state.layoutEditMode) return;                                             // layout mode owns the drag
  e.preventDefault(); e.stopPropagation();
  const tile = e.currentTarget;
  jigDrag = { jigId:tile.dataset.jigId, startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null, sourceEl:tile };
  window.addEventListener('pointermove', onJigPointerMove);
  window.addEventListener('pointerup', onJigPointerUp, {once:true});
}
function onJigPointerMove(e){
  if(!jigDrag) return;
  const dx=e.clientX-jigDrag.startX, dy=e.clientY-jigDrag.startY;
  if(!jigDrag.moved && Math.hypot(dx,dy)>6){
    jigDrag.moved = true;
    const ghost = jigDrag.sourceEl.cloneNode(true);
    ghost.classList.add('chip-ghost-avatar');
    document.body.appendChild(ghost);
    jigDrag.ghostEl = ghost;
    jigDrag.sourceEl.classList.add('dragging');
  }
  if(jigDrag.moved && jigDrag.ghostEl){
    jigDrag.ghostEl.style.left=e.clientX+'px';
    jigDrag.ghostEl.style.top=e.clientY+'px';
    document.querySelectorAll('.jig-target').forEach(el=>el.classList.remove('jig-target'));
    document.querySelectorAll('[data-jig-drop]').forEach(el=>el.classList.remove('dragover'));
    const host = jigHostAt(e.clientX, e.clientY);
    if(host && host.el){
      if(host.el.classList.contains('machine-tile') || host.el.classList.contains('support-tile')) host.el.classList.add('jig-target');
      else host.el.classList.add('dragover');
    }
  }
}
/* where would this jig land? returns the host element + the machine id (or TRAY) */
function jigHostAt(x,y){
  const el = document.elementFromPoint(x,y);
  if(!el) return null;
  const tray = el.closest('[data-jig-drop="TRAY"]');
  if(tray) return { el:tray, id:'TRAY' };
  const mtile = el.closest('.machine-tile');
  if(mtile) return { el:mtile, id:mtile.dataset.machineTileId };
  const stile = el.closest('.support-tile');            // e.g. the central Secondary area
  if(stile) return { el:stile, id:stile.dataset.supportTileId };
  const drop = el.closest('[data-jig-drop]');
  if(drop) return { el:drop, id:drop.dataset.jigDrop };
  return null;
}
function onJigPointerUp(e){
  window.removeEventListener('pointermove', onJigPointerMove);
  if(!jigDrag) return;
  const ctx = jigDrag;
  document.querySelectorAll('[data-jig-drop]').forEach(el=>el.classList.remove('dragover'));
  if(ctx.ghostEl) ctx.ghostEl.remove();
  ctx.sourceEl && ctx.sourceEl.classList.remove('dragging');
  document.querySelectorAll('.jig-target').forEach(el=>el.classList.remove('jig-target'));
  if(ctx.moved){
    const host = jigHostAt(e.clientX, e.clientY);
    const jig = state.jigs.find(j=>j.id===ctx.jigId);
    if(jig && host){
      if(host.id === 'TRAY'){ jig.machineId = null; }
      else {
        jig.machineId = host.id;
        // drop exactly where the pointer is, relative to the machine card
        if(host.el.classList.contains('machine-tile') || host.el.classList.contains('support-tile')){
          const r = host.el.getBoundingClientRect();
          if(r.width>10 && r.height>10){
            jig.pos = { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
            jigPos(jig);
          }
        }
      }
    }
    if(state.activeTab==='floor'){
      document.querySelectorAll('[data-jig-layer]').forEach(l=>renderJigLayerInto(l, l.dataset.jigLayer));
      const tray = document.getElementById('jig-tray');
      if(tray) renderJigTrayInto(tray);
      updateFloorSummaryBar();
      persistLocal(); scheduleCloudSave();
    } else {
      renderTabs();
    }
  }
  setTimeout(()=>{ jigDrag=null; }, 0);
}

function nextWorkerId(){
  let max=0;
  state.workers.forEach(w=>{ const n=parseInt(w.id.replace('W',''),10); if(n>max) max=n; });
  return 'W'+String(max+1).padStart(2,'0');
}
function createWorker(name){
  const idx = state.workers.length;
  const id = nextWorkerId();
  const w = {
    id, name: name || id, slots: [], role:'operator',
    breakGroup: BREAK_GROUP_ORDER[idx%3],
    avatar: AVATAR_STYLES[idx%AVATAR_STYLES.length],
    color: WORKER_COLOR_PALETTE[idx%WORKER_COLOR_PALETTE.length],
    shiftAssign: {},
    reliefFor: null,
    special: 'none',
    rotation: {enabled:false, anchorWeek:null, anchorShift:'day'}
  };
  state.workers.push(w);
  return w;
}
function findSlotIdByText(text){
  if(!text) return null;
  const t = String(text).trim().toLowerCase();
  if(!t) return null;
  for(const id in state.labels.machine){ if(state.labels.machine[id].toLowerCase()===t || id.toLowerCase()===t) return id; }
  for(const id in state.labels.support){ if(state.labels.support[id].toLowerCase()===t || id.toLowerCase()===t) return id; }
  // partial/contains match as fallback
  for(const id in state.labels.machine){ if(state.labels.machine[id].toLowerCase().includes(t) || t.includes(id.toLowerCase())) return id; }
  for(const id in state.labels.support){ if(state.labels.support[id].toLowerCase().includes(t)) return id; }
  return null;
}
function processNameSectionRows(rows){
  // rows: array of arrays, first row may be a header (auto-detected)
  if(rows.length===0) return {created:0, updated:0, matched:0, unmatched:0};
  let startIdx = 0, nameCol = 0, sectionCol = 1, shiftCol = -1;
  const firstRowLower = rows[0].map(h=>String(h||'').trim().toLowerCase());
  const looksLikeHeader = firstRowLower.some(h=>h.includes('name')||h.includes('ชื่อ')||h.includes('section')||h.includes('ตำแหน่ง')||h.includes('ส่วนงาน'));
  if(looksLikeHeader){
    startIdx = 1;
    const nc = firstRowLower.findIndex(h=>h.includes('name')||h.includes('ชื่อ'));
    const sc = firstRowLower.findIndex(h=>h.includes('section')||h.includes('ส่วนงาน')||h.includes('ตำแหน่ง')||h.includes('machine')||h.includes('เครื่อง'));
    const sh = firstRowLower.findIndex(h=>h.includes('shift')||h.includes('กะ'));
    if(nc>=0) nameCol = nc;
    if(sc>=0) sectionCol = sc;
    shiftCol = sh;
  }
  let created=0, updated=0, matched=0, unmatched=0;
  for(let i=startIdx;i<rows.length;i++){
    const row = rows[i];
    if(!row || row.length===0) continue;
    const name = row[nameCol] ? String(row[nameCol]).trim() : '';
    if(!name) continue;
    const sectionText = row[sectionCol]!==undefined ? String(row[sectionCol]||'').trim() : '';
    const shiftText = (shiftCol>=0 && row[shiftCol]!==undefined) ? String(row[shiftCol]||'').trim().toLowerCase() : '';
    const shift = (shiftText.includes('night')||shiftText.includes('คืน')) ? 'night' : 'day';
    let w = state.workers.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(w){ updated++; } else { w = createWorker(name); created++; }
    if(sectionText){
      const slotId = findSlotIdByText(sectionText);
      if(slotId){ addSlotToWorker(w.id, slotId, shift); matched++; }
      else { unmatched++; }
    }
  }
  return {created, updated, matched, unmatched};
}
function importSummaryMsg(r){
  return T(
    `นำเข้าสำเร็จ: เพิ่มใหม่ ${r.created} คน, อัปเดต ${r.updated} คน, จับคู่ตำแหน่งได้ ${r.matched} รายการ${r.unmatched?`, ไม่พบตำแหน่งที่ตรงกัน ${r.unmatched} รายการ`:''}`,
    `Import complete: ${r.created} new, ${r.updated} updated, ${r.matched} positions matched${r.unmatched?`, ${r.unmatched} unmatched`:''}`
  );
}
function handleExcelImport(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('excel-status');
  statusEl.textContent = T('กำลังอ่านไฟล์...','Reading file...'); statusEl.style.color='var(--grey-txt)';
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      if(rows.length<1){ statusEl.textContent=T('ไม่พบข้อมูลในไฟล์','No data found in file'); statusEl.style.color='var(--red)'; return; }
      const result = processNameSectionRows(rows);
      if(result.created===0 && result.updated===0){ statusEl.textContent=T('ไม่พบคอลัมน์ชื่อ หรือไม่มีข้อมูล','No name column or data found'); statusEl.style.color='var(--red)'; return; }
      renderTabs();
      const freshStatusEl = document.getElementById('excel-status');
      if(freshStatusEl){ freshStatusEl.textContent = importSummaryMsg(result); freshStatusEl.style.color='var(--green)'; }
    } catch(err){
      statusEl.textContent = T('อ่านไฟล์ไม่สำเร็จ: ','Failed to read file: ')+err.message;
      statusEl.style.color='var(--red)';
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function handlePasteImport(){
  const textarea = document.getElementById('paste-import-textarea');
  const statusEl = document.getElementById('paste-import-status');
  const text = textarea.value;
  if(!text || !text.trim()){ statusEl.textContent=T('กรุณาวางข้อมูลก่อน','Please paste data first'); statusEl.style.color='var(--red)'; return; }
  try{
    const lines = text.split(/\r\n|\r|\n/).filter(l=>l.trim().length>0);
    const rows = lines.map(line=>{
      if(line.includes('\t')) return line.split('\t').map(c=>c.trim());
      // fallback: split on 2+ spaces (in case tabs got lost in paste)
      if(/ {2,}/.test(line)) return line.split(/ {2,}/).map(c=>c.trim());
      return [line.trim()]; // just a name, no section
    });
    const result = processNameSectionRows(rows);
    if(result.created===0 && result.updated===0){
      statusEl.textContent = T('ไม่พบข้อมูลชื่อที่ใช้ได้','No usable name data found');
      statusEl.style.color='var(--red)';
      return;
    }
    renderTabs();
    const freshStatus = document.getElementById('paste-import-status');
    const freshPanel = document.getElementById('paste-import-panel');
    const freshTextarea = document.getElementById('paste-import-textarea');
    if(freshPanel) freshPanel.style.display='block';
    if(freshTextarea) freshTextarea.value='';
    if(freshStatus){ freshStatus.textContent = importSummaryMsg(result); freshStatus.style.color='var(--green)'; }
  } catch(err){
    statusEl.textContent = T('นำเข้าไม่สำเร็จ: ','Import failed: ')+err.message;
    statusEl.style.color='var(--red)';
  }
}

}

/* ============================================================

   ============================================================ */
const LS_CURRENT   = 'mps_current_v4';
const LS_SCENARIOS = 'mps_scenarios_v4';
let localSaveTimer = null;

function persistLocal(){
  clearTimeout(localSaveTimer);
  localSaveTimer = setTimeout(()=>{
    try{ localStorage.setItem(LS_CURRENT, serializeState()); }catch(err){ /* quota / private mode */ }
  }, 400);
}
function restoreLocal(){
  try{
    const raw = localStorage.getItem(LS_CURRENT);
    if(!raw) return false;
    const loaded = JSON.parse(raw);
    state = { ...state, ...loaded, panelType:null, panelId:null, selectedChip:null, selectedJig:null,
              bulkSelectMode:false, bulkSelectedIds:[] };
    migrateState();
    return true;
  }catch(err){ return false; }
}
function loadScenarios(){
  try{ return JSON.parse(localStorage.getItem(LS_SCENARIOS) || '{}'); }
  catch(err){ return {}; }
}
function writeScenarios(obj){
  try{ localStorage.setItem(LS_SCENARIOS, JSON.stringify(obj)); return true; }
  catch(err){ alert(T('บันทึกไม่สำเร็จ — พื้นที่จัดเก็บของเบราว์เซอร์เต็ม','Save failed — browser storage is full')); return false; }
}
function scenarioSaveAs(){
  const suggested = state.scenarioName || (T('แผน ','Plan ') + (Object.keys(loadScenarios()).length+1));
  const name = prompt(T('ตั้งชื่อรูปแบบการวางแผนนี้:','Name this planning scenario:'), suggested);
  if(!name || !name.trim()) return;
  const key = name.trim();
  const all = loadScenarios();
  if(all[key] && !confirm(T('มีรูปแบบชื่อนี้อยู่แล้ว — บันทึกทับ?','A scenario with this name exists — overwrite?'))) return;
  all[key] = { savedAt: Date.now(), data: serializeState() };
  if(writeScenarios(all)){
    state.scenarioName = key;
    persistLocal();
    renderScenarioBar(T('บันทึกรูปแบบ "','Saved scenario "')+key+'" ✓');
  }
}
function scenarioSaveOver(){
  if(!state.scenarioName){ scenarioSaveAs(); return; }
  const all = loadScenarios();
  all[state.scenarioName] = { savedAt: Date.now(), data: serializeState() };
  if(writeScenarios(all)) renderScenarioBar(T('บันทึกทับ "','Updated "')+state.scenarioName+'" ✓');
}
function scenarioLoad(name){
  const all = loadScenarios();
  const entry = all[name];
  if(!entry) return;
  if(!confirm(T('เปิดรูปแบบ "'+name+'" ? งานที่ยังไม่ได้บันทึกจะถูกแทนที่','Open scenario "'+name+'"? Unsaved work will be replaced'))) {
    renderScenarioBar(); return;
  }
  try{
    const loaded = JSON.parse(entry.data);
    const keepTab = state.activeTab;
    state = { ...freshState(), ...loaded, panelType:null, panelId:null,
              selectedChip:null, selectedJig:null, bulkSelectMode:false, bulkSelectedIds:[] };
    state.activeTab = keepTab;
    state.scenarioName = name;
    migrateState();
    floorFittedOnce = false;
    persistLocal();
    renderShell();
    renderTabs();
  }catch(err){ alert(T('เปิดรูปแบบไม่สำเร็จ','Failed to open scenario')); }
}
function scenarioDelete(){
  if(!state.scenarioName) return;
  if(!confirm(T('ลบรูปแบบ "'+state.scenarioName+'" ออกจากรายการ?','Delete scenario "'+state.scenarioName+'"?'))) return;
  const all = loadScenarios();
  delete all[state.scenarioName];
  writeScenarios(all);
  state.scenarioName = '';
  persistLocal();
  renderScenarioBar(T('ลบแล้ว','Deleted'));
}
function scenarioDuplicate(){
  const base = state.scenarioName || T('แผน','Plan');

  const all = loadScenarios();
  all[name.trim()] = { savedAt: Date.now(), data: serializeState() };
  if(writeScenarios(all)){ state.scenarioName = name.trim(); persistLocal(); renderScenarioBar(T('สร้างสำเนาแล้ว ✓','Copy created ✓')); }
}

function initFirebase(){
  if(typeof firebase === 'undefined') return; // SDK failed to load (e.g. offline)
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') return; // not configured yet
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    firebaseReady = true;
    firebase.auth().onAuthStateChanged(user=>{
      isEditor = !!user;
      currentUserEmail = user ? user.email : null;
      renderShell();
      renderTabs();
    });
    startCloudSync();
  } catch(err){
    console.error('Firebase init failed', err);
  }
}
function startCloudSync(){
  if(!fbDb) return;
  fbDb.collection(CLOUD_DOC_PATH.collection).doc(CLOUD_DOC_PATH.doc).onSnapshot(docSnap=>{
    if(!docSnap.exists) return;
    const remote = docSnap.data();
    if(!remote || !remote.data) return;
    // Ignore the echo of our own write — re-rendering here is what made the
    // floor plan jump back/resize a moment after each edit.
    if(remote.clientId === CLIENT_ID) return;
    if(remote.data === lastLocalPayload) return;
    applyingRemote = true;
    try{
      const loaded = JSON.parse(remote.data);
      const keepTab = state.activeTab, keepZoom = state.canvasZoom;
      state = { ...state, ...loaded, panelType:null, panelId:null };
      state.activeTab = keepTab;
      if(keepZoom) state.canvasZoom = keepZoom;
      migrateState();
      renderShell();
      renderTabs();
    } catch(err){ console.error('apply remote state failed', err); }
    finally { applyingRemote = false; }
  }, err=>console.error('cloud sync listener error', err));
}
function scheduleCloudSave(){
  if(!firebaseReady || !isEditor || applyingRemote || !fbDb) return;
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{
    lastLocalPayload = serializeState();
    fbDb.collection(CLOUD_DOC_PATH.collection).doc(CLOUD_DOC_PATH.doc).set({
      data: lastLocalPayload, updatedAt: Date.now(), updatedBy: currentUserEmail||'unknown', clientId: CLIENT_ID
    }).catch(err=>console.error('cloud save failed', err));
  }, 800);
}
function saveCloudNow(){
  // immediate (non-debounced) save, for explicit user-triggered save actions
  clearTimeout(saveDebounceTimer);
  if(!firebaseReady || !isEditor || !fbDb) return Promise.resolve(false);
  lastLocalPayload = serializeState();
  return fbDb.collection(CLOUD_DOC_PATH.collection).doc(CLOUD_DOC_PATH.doc).set({
    data: lastLocalPayload, updatedAt: Date.now(), updatedBy: currentUserEmail||'unknown', clientId: CLIENT_ID
  }).then(()=>true).catch(err=>{ console.error('cloud save failed', err); return false; });
}

  document.getElementById('dp-decom-date').addEventListener('input', e=>{ meta.decommission.date=e.target.value; });
  const reqDay = document.getElementById('dp-req-day');
  const reqNight = document.getElementById('dp-req-night');

  function refreshReqUI(){
    const tile = document.querySelector('[data-machine-tile-id="'+m.id+'"]');
    if(tile) updateTileReqLine(tile, m.id);
    updateFloorSummaryBar();
    persistLocal(); scheduleCloudSave();
    renderPanel();
  }
  function commitReq(){
    machineReq(m.id).day   = cleanReq(reqDay.value);
    machineReq(m.id).night = cleanReq(reqNight.value);
    refreshReqUI();
  }
  reqDay.addEventListener('change', commitReq);
  reqNight.addEventListener('change', commitReq);
  document.querySelectorAll('.dp-ratio').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = parseInt(btn.dataset.ratio,10)||1;
      const v = Math.round((1/n)*100)/100;
      machineReq(m.id).day = v;
      machineReq(m.id).night = v;
      refreshReqUI();
    });
  });
  document.getElementById('dp-req-apply-zone').addEventListener('click', ()=>{
    const zk = currentZoneOf(m.id);
    const ids = MACHINES.filter(x=>currentZoneOf(x.id)===zk).map(x=>x.id);
    if(!confirm(T('ตั้งจำนวนคนของเครื่องทั้ง '+ids.length+' เครื่องในโซนนี้ให้เท่ากับเครื่องนี้?','Set the headcount of all '+ids.length+' machines in this zone to match this one?'))) return;
    const src = machineReq(m.id);
    ids.forEach(id=>{ machineReq(id).day = src.day; machineReq(id).night = src.night; });
    persistLocal(); scheduleCloudSave();
    renderFloorTab();
    renderPanel();
  });
}

function labelForSlot(slotId){
  if(isJigSlot(slotId)){
    const j = jigOfSlot(slotId);
    return j ? (j.name + (j.machineId ? ' @ '+labelForSlot(j.machineId) : '')) : slotId;
  }
  if(state.labels.machine[slotId]) return state.labels.machine[slotId];
  if(state.labels.support[slotId]) return state.labels.support[slotId];
  return slotId;
}

      <button class="reset-btn" id="jp-delete" style="background:var(--red);width:100%;">${T('ลบ Jig นี้','Delete this Jig')}</button>
    </div>
  `;
  document.getElementById('jp-close').addEventListener('click', closePanel);
  document.getElementById('jp-name').addEventListener('input', e=>{ j.name = e.target.value || '2nd Jig'; });
  document.getElementById('jp-name').addEventListener('blur', ()=>renderTabs());
  panel.querySelectorAll('[data-color]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ j.color = btn.dataset.color; renderPanel(); renderTabs(); });
  });
  panel.querySelectorAll('[data-status]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ j.status = btn.dataset.status; renderPanel(); renderTabs(); });
  });
  document.getElementById('jp-host').addEventListener('change', e=>{
    const v = e.target.value || null;
    if(!v){
      // uninstalled -> nobody can be manning it any more
      workersCoveringSlot(jigSlotId(j.id)).forEach(w=>removeSlotFromWorker(w.id, jigSlotId(j.id)));
    }
    j.machineId = v;
    j.pos = { x:0.5, y:0.78 };
    renderPanel(); renderTabs();
  });
  document.getElementById('jp-req').addEventListener('change', e=>{
    j.req = Math.max(0, Math.min(9, Math.round((parseFloat(e.target.value)||0)*100)/100));
    renderPanel(); renderTabs();
  });
  document.getElementById('jp-delete').addEventListener('click', ()=>{
    workersCoveringSlot(jigSlotId(j.id)).forEach(w=>removeSlotFromWorker(w.id, jigSlotId(j.id)));
    state.jigs = state.jigs.filter(x=>x.id!==j.id);
    closePanel(); renderTabs();
  });
}

function floorSummaryHtml(){
  const activeMachines = MACHINES.filter(m=>!isDecommissioned(m.id));
  const critical = activeMachines.filter(m=>machineStatus(m.id)==='critical');
  const nightGap = activeMachines.filter(m=>machineNeedsNightShift(m.id) && operatorsForShift(m.id,'night').length===0);
  const satOT = activeMachines.filter(m=>machineRequiresSaturdayOT(m.id));
  const shortMachines = activeMachines.filter(m=>effectiveAssigned(m.id) < machineRequiredTotal(m.id) - 0.001);
  return `
      <div class="summary-card"><div class="lbl">${T('เครื่องที่ใช้งาน','Active machines')}</div><div class="big">${activeMachines.length}</div><div class="sub">${T('จาก','of')} ${MACHINES.length} ${T('เครื่อง','machines')} (${MACHINES.length-activeMachines.length} ${T('ปิด/ย้ายออก','closed/relocated')})</div></div>

let floorFittedOnce = false;

function setCanvasZoom(z){
  state.canvasZoom = Math.max(0.3, Math.min(1.5, Math.round(z*10)/10));
  const label = document.getElementById('zoom-pct-label');
  if(label) label.textContent = Math.round(state.canvasZoom*100)+'%';
  applyCanvasZoom();
  state.canvasZoomInitialized = true;
  persistLocal();
}
function applyCanvasZoom(){
  const inner = document.getElementById('factory-canvas-inner');
  const sizer = document.getElementById('factory-canvas-sizer');
  if(!inner || !sizer) return;
  const natW = parseFloat(inner.dataset.natW||0), natH = parseFloat(inner.dataset.natH||0);
  const z = state.canvasZoom;
  inner.style.transform = 'scale('+z+')';
  sizer.style.width = (natW*z)+'px';
  sizer.style.height = (natH*z)+'px';
}
  function fitCanvasToScreen() {
  const wrapper = document.getElementById('factory-canvas');
  const inner = document.getElementById('factory-canvas-inner');

  if (!wrapper || !inner) return;

  const natW = parseFloat(inner.dataset.natW || 0);
  const natH = parseFloat(inner.dataset.natH || 0);

  if (!natW || !natH) return;

  const availableW = wrapper.clientWidth - 40;
  const availableH = window.innerHeight - 250;

  const zoomX = availableW / natW;
  const zoomY = availableH / natH;

  let zoom = Math.min(zoomX, zoomY);

  // จำกัดช่วงซูม
  zoom = Math.max(0.3, Math.min(1.5, zoom));

  state.canvasZoom = Math.round(zoom * 100) / 100;

  applyCanvasZoom();

  const label = document.getElementById('zoom-pct-label');
  if (label) {
    label.textContent =
      Math.round(state.canvasZoom * 100) + '%';
  }
}

function buildCanvas(){
  const canvas = document.getElementById('factory-canvas-inner');
  if(!canvas) return;
  // canvas height = tallest bottom edge + margin
  let maxBottom = 400, maxRight = 800;
  allRegionKeys().forEach(k=>{
    const p = state.regionPos[k];
    if(p){ maxBottom = Math.max(maxBottom, p.y+p.h); maxRight = Math.max(maxRight, p.x+p.w); }
  });
  canvas.style.height = (maxBottom+40)+'px';
  canvas.style.width = (maxRight+40)+'px';
  canvas.dataset.natW = maxRight+40;
  canvas.dataset.natH = maxBottom+40;

  // paint in z-order (state.regionZOrder), append any missing keys at the end
  const keys = allRegionKeys();
  const order = state.regionZOrder.filter(k=>keys.includes(k));
  keys.forEach(k=>{ if(!order.includes(k)) order.push(k); });
  state.regionZOrder = order;

   order.forEach((itemKey,zi)=>{
    const [kind,id] = itemKey.split(':');
    let regionEl;
    if(kind==='support'){
      const z = findZone(id);
      if(!z) return;
      regionEl = renderSupportTile(z);
    } else if(kind==='custom'){
      const area = state.customAreas.find(a=>a.id===id);
      if(!area) return;
      regionEl = renderCustomAreaBox(area);
    } else if(kind==='machine'){
      const m = MACHINES.find(x=>x.id===id);
      if(!m) return;
      regionEl = renderMachineTile(m);
    } else {
      regionEl = renderZoneBoxByKey(id);
    }
    regionEl.classList.add('region-item');
    regionEl.dataset.itemKey = itemKey;
    let pos = state.regionPos[itemKey];
    if(!pos){
      pos = { x:20, y:20, w: (kind==='machine'?150:260), h: (kind==='machine'?190:140), userResized:true };
      state.regionPos[itemKey] = pos;
    }
    applyRegionGeometry(regionEl, itemKey, pos);
    // Keep cream zone boxes behind all cards/other items.
    // Zones can still overlap freely, but they must never cover machine/support cards.
    regionEl.style.zIndex = (kind === 'zone') ? 1 : (20 + zi);

    const handle = document.createElement('div');
    handle.className='region-drag-handle';
    handle.title=T('ลากเพื่อย้ายตำแหน่งพื้นที่นี้ (วางซ้อนทับได้อิสระ)','Drag to move this area (free overlap allowed)');
    handle.textContent='⠿⠿';
    handle.addEventListener('pointerdown', onRegionPointerDown);
    regionEl.insertBefore(handle, regionEl.firstChild);

    // Explicit resize grip. We deliberately do NOT use CSS resize + ResizeObserver:
    // contentRect is the *content box* while the inline style is the *border box*,
    // so every re-render used to write back a slightly smaller size and the whole
    // floor plan drifted/shrank a little each time somebody was dropped on a machine.
    const grip = document.createElement('div');
    grip.className = 'region-resize-grip';
    grip.title = T('ลากเพื่อปรับขนาดพื้นที่','Drag to resize this area');
    grip.addEventListener('pointerdown', onGripPointerDown);
    regionEl.appendChild(grip);

    if(state.editingRegion === itemKey) regionEl.classList.add('editing');
    if(state.selectedRegions.includes(itemKey)) regionEl.classList.add('region-selected');
    // Double-click unlocks this single card for moving/resizing
    regionEl.addEventListener('dblclick', (e)=>{
      if(e.target.closest('input')) return;
      e.stopPropagation(); e.preventDefault();
      setEditingRegion(itemKey, e.shiftKey);
    });
    // In layout mode (or once unlocked) the whole card is draggable
    regionEl.addEventListener('pointerdown', onRegionBodyPointerDown);

    canvas.appendChild(regionEl);
  });
  canvas.addEventListener('pointerdown', (e)=>{
    if(e.target === canvas) clearRegionEditing();
  });
  applyCanvasZoom();
}

/* Size/position is applied from state ONLY — never measured back from the DOM. */
function applyRegionGeometry(el, itemKey, pos){
  const isMachine = itemKey.startsWith('machine:');
  const isZone = itemKey.startsWith('zone:');
  const maxW = isMachine ? 420 : 2600, maxH = isMachine ? 460 : 1400;
  pos.w = Math.max(60, Math.min(maxW, Math.round(pos.w||(isMachine?150:260))));
  pos.h = Math.max(50, Math.min(maxH, Math.round(pos.h||(isMachine?190:140))));
  el.style.position = 'absolute';
  el.style.left = pos.x+'px';
  el.style.top  = pos.y+'px';
  el.style.width = pos.w+'px';
  if(isZone){
    el.style.height = pos.h+'px';        // zone boxes are pure backgrounds: exact size
  } else {
    el.style.height = 'auto';            // cards grow downward instead of clipping content
    el.style.minHeight = pos.h+'px';
  }
}

/* ============================================================
   LAYOUT EDIT MODE — cards are locked until you double-click one
   (or switch on layout mode), so people-dragging never moves a card
   ============================================================ */
function setEditingRegion(itemKey, addToSelection){
  state.editingRegion = itemKey;
  if(addToSelection){
    if(state.selectedRegions.includes(itemKey)) state.selectedRegions = state.selectedRegions.filter(k=>k!==itemKey);
    else state.selectedRegions.push(itemKey);
  } else {
    state.selectedRegions = itemKey ? [itemKey] : [];
  }
  applyRegionEditClasses();
  renderLayoutToolbar();
}
function clearRegionEditing(){
  state.editingRegion = null;
  state.selectedRegions = [];
  applyRegionEditClasses();
  renderLayoutToolbar();
}
function applyRegionEditClasses(){
  document.body.classList.toggle('layout-edit', !!state.layoutEditMode);
  document.querySelectorAll('.region-item').forEach(el=>{
    const k = el.dataset.itemKey;
    el.classList.toggle('editing', state.editingRegion===k);
    el.classList.toggle('region-selected', state.selectedRegions.includes(k));
  });
}
function regionUnlocked(itemKey){
  return !!state.layoutEditMode || state.editingRegion===itemKey;
}
function onRegionBodyPointerDown(e){
  const region = e.currentTarget;
  const itemKey = region.dataset.itemKey;
  if(!regionUnlocked(itemKey)) return;                     // locked -> let people/jig drags work
  if(e.target.closest('input,select,button,.region-resize-grip,.region-drag-handle')) return;
  if(state.layoutEditMode && !state.selectedRegions.includes(itemKey)){
    setEditingRegion(itemKey, e.shiftKey);
  }
  e.preventDefault(); e.stopPropagation();
  startRegionDrag(region, itemKey, e);
}
function startRegionDrag(region, itemKey, e){
  bringRegionToFront(itemKey);
  if(!itemKey.startsWith('zone:')) region.style.zIndex = 999;
  const pos = state.regionPos[itemKey];
  // move every selected card together
  const group = (state.selectedRegions.includes(itemKey) && state.selectedRegions.length>1)
    ? state.selectedRegions.slice() : [itemKey];
  const origins = {};
  group.forEach(k=>{ const p=state.regionPos[k]; if(p) origins[k]={x:p.x,y:p.y}; });
  regionDrag = { itemKey, startX:e.clientX, startY:e.clientY, origX:pos.x, origY:pos.y, sourceEl:region, group, origins };
  window.addEventListener('pointermove', onRegionPointerMove);
  window.addEventListener('pointerup', onRegionPointerUp, {once:true});
}

/* ---------- alignment / distribution / equal size ---------- */
function selectedPos(){
  return state.selectedRegions.map(k=>({k, p:state.regionPos[k]})).filter(o=>o.p);
}
function alignRegions(mode){
  const list = selectedPos();
  if(list.length<2) return;
  const lefts = list.map(o=>o.p.x), rights = list.map(o=>o.p.x+o.p.w);
  const tops = list.map(o=>o.p.y), bottoms = list.map(o=>o.p.y+o.p.h);
  const L=Math.min(...lefts), R=Math.max(...rights), Tp=Math.min(...tops), B=Math.max(...bottoms);
  const cx=(L+R)/2, cy=(Tp+B)/2;
  list.forEach(o=>{
    if(mode==='left')   o.p.x = L;
    if(mode==='right')  o.p.x = R - o.p.w;
    if(mode==='top')    o.p.y = Tp;
    if(mode==='bottom') o.p.y = B - o.p.h;
    if(mode==='centerH')o.p.x = Math.round(cx - o.p.w/2);
    if(mode==='centerV')o.p.y = Math.round(cy - o.p.h/2);
  });
  commitLayoutChange();
}
function distributeRegions(axis){
  const list = selectedPos();
  if(list.length<3) return;
  if(axis==='h'){
    list.sort((a,b)=>a.p.x-b.p.x);
    const first=list[0].p, last=list[list.length-1].p;
    const totalW = list.reduce((a,o)=>a+o.p.w,0);
    const span = (last.x+last.w) - first.x;
    const gap = (span - totalW) / (list.length-1);
    let x = first.x;
    list.forEach(o=>{ o.p.x = Math.round(x); x += o.p.w + gap; });
  } else {
    list.sort((a,b)=>a.p.y-b.p.y);
    const first=list[0].p, last=list[list.length-1].p;
    const totalH = list.reduce((a,o)=>a+o.p.h,0);
    const span = (last.y+last.h) - first.y;
    const gap = (span - totalH) / (list.length-1);
    let y = first.y;
    list.forEach(o=>{ o.p.y = Math.round(y); y += o.p.h + gap; });
  }
  commitLayoutChange();
}
function equalizeSelectedSize(){
  const list = selectedPos();
  if(list.length<2) return;
  const ref = list[0].p;                       // first selected = reference
  list.forEach(o=>{ o.p.w = ref.w; o.p.h = ref.h; o.p.userResized = true; });
  commitLayoutChange();
}
/* one click: every injection-machine card gets exactly the same size */
function equalizeAllMachineCards(){
  const keys = MACHINES.map(m=>'machine:'+m.id).filter(k=>state.regionPos[k]);
  if(!keys.length) return;
  const counts = {};
  keys.forEach(k=>{ const p=state.regionPos[k]; const s=p.w+'x'+p.h; counts[s]=(counts[s]||0)+1; });
  let best = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  let [W,H] = best.split('x').map(Number);
  if(!W || !H){ W=150; H=210; }
  keys.forEach(k=>{ const p=state.regionPos[k]; p.w=W; p.h=H; p.userResized=true; });
  commitLayoutChange();
  return {W,H,n:keys.length};
}
/* tidy up: lay every machine of a zone in a neat row inside its zone box */
function autoArrangeZones(){
  const GAP = 10, PAD = 10, TITLE = 42;
  ['A','B','C','R1','R2','R3'].forEach(zk=>{
    const zoneKey = 'zone:'+zk;
    const zp = state.regionPos[zoneKey];
    if(!zp) return;
    const ids = MACHINES.filter(m=>state.machineZone[m.id]===zk).map(m=>m.id);
    if(!ids.length) return;
    const cardW = state.regionPos['machine:'+ids[0]] ? state.regionPos['machine:'+ids[0]].w : 150;
    const cardH = state.regionPos['machine:'+ids[0]] ? state.regionPos['machine:'+ids[0]].h : 210;
    ids.forEach((id,i)=>{
      const p = state.regionPos['machine:'+id];
      if(!p) return;
      p.w = cardW; p.h = cardH; p.userResized = true;
      p.x = zp.x + PAD + i*(cardW+GAP);
      p.y = zp.y + TITLE;
    });
    zp.w = PAD*2 + ids.length*cardW + (ids.length-1)*GAP;
    zp.h = TITLE + cardH + PAD;
    zp.userResized = true;
  });
  commitLayoutChange();
}

function commitLayoutChange(){
  document.querySelectorAll('.region-item').forEach(el=>{
    const k = el.dataset.itemKey, p = state.regionPos[k];
    if(p) applyRegionGeometry(el, k, p);
  });
  growCanvasToContent();
  renderLayoutToolbar();
  persistLocal(); scheduleCloudSave();
}
function nudgeSelection(dx,dy){
  const list = selectedPos();
  if(!list.length) return;
  list.forEach(o=>{ o.p.x = Math.max(0,o.p.x+dx); o.p.y = Math.max(0,o.p.y+dy); });
  commitLayoutChange();
}

/* ---- region (support tile / zone box / custom area / machine) FREE drag: absolute reposition, overlap allowed ---- */
let regionDrag = null;
function onRegionPointerDown(e){
  e.preventDefault(); e.stopPropagation();
  const region = e.currentTarget.closest('.region-item');
  startRegionDrag(region, region.dataset.itemKey, e);
}
function snap(v){ const g = (state && state.snapGrid) ? state.snapGrid : 5; return g<=1 ? Math.round(v) : Math.round(v/g)*g; }
function onRegionPointerMove(e){
  if(!regionDrag) return;
  const z = state.canvasZoom || 1;
  const dx=(e.clientX-regionDrag.startX)/z, dy=(e.clientY-regionDrag.startY)/z;
  const keys = regionDrag.group || [regionDrag.itemKey];
  keys.forEach(k=>{
    const pos = state.regionPos[k], o = regionDrag.origins ? regionDrag.origins[k] : null;
    if(!pos || !o) return;
    pos.x = Math.max(0, snap(o.x+dx));
    pos.y = Math.max(0, snap(o.y+dy));
    const el = document.querySelector('.region-item[data-item-key="'+cssEsc(k)+'"]');
    if(el){ el.style.left = pos.x+'px'; el.style.top = pos.y+'px'; }
  });
}
function cssEsc(v){ return String(v).replace(/"/g,'\\"'); }
function onRegionPointerUp(){
  window.removeEventListener('pointermove', onRegionPointerMove);
  if(!regionDrag) return;
  regionDrag = null;
  growCanvasToContent();
  persistLocal(); scheduleCloudSave();
}

/* ---- explicit resize grip ---- */
let regionResize = null;
function onGripPointerDown(e){
  e.preventDefault(); e.stopPropagation();
  const region = e.currentTarget.closest('.region-item');
  const itemKey = region.dataset.itemKey;
  const pos = state.regionPos[itemKey];
  if(!pos) return;
  regionResize = { itemKey, el:region, startX:e.clientX, startY:e.clientY, w:pos.w, h:pos.h };
  window.addEventListener('pointermove', onGripPointerMove);
  window.addEventListener('pointerup', onGripPointerUp, {once:true});
}
function onGripPointerMove(e){
  if(!regionResize) return;
  const z = state.canvasZoom || 1;
  const nw = snap(regionResize.w + (e.clientX-regionResize.startX)/z);
  const nh = snap(regionResize.h + (e.clientY-regionResize.startY)/z);
  const keys = (state.selectedRegions.includes(regionResize.itemKey) && state.selectedRegions.length>1)
    ? state.selectedRegions : [regionResize.itemKey];
  keys.forEach(k=>{
    const p = state.regionPos[k];
    if(!p) return;
    p.w = nw; p.h = nh; p.userResized = true;
    const el = document.querySelector('.region-item[data-item-key="'+cssEsc(k)+'"]');
    if(el) applyRegionGeometry(el, k, p);
  });
}
function onGripPointerUp(){
  window.removeEventListener('pointermove', onGripPointerMove);
  if(!regionResize) return;
  regionResize = null;
  growCanvasToContent();
  persistLocal(); scheduleCloudSave();
}
function growCanvasToContent(){
  const inner = document.getElementById('factory-canvas-inner');
  if(!inner) return;
  let maxBottom = 400, maxRight = 800;
  allRegionKeys().forEach(k=>{
    const p = state.regionPos[k];
    if(p){ maxBottom = Math.max(maxBottom, p.y+p.h); maxRight = Math.max(maxRight, p.x+p.w); }
  });
  inner.style.height = (maxBottom+40)+'px';
  inner.style.width  = (maxRight+40)+'px';
  inner.dataset.natW = maxRight+40;
  inner.dataset.natH = maxBottom+40;
  applyCanvasZoom();
}


function reqLineInner(id){
  if(isDecommissioned(id)) return `<span class="req-pill" style="background:#EEE;color:#8A939B;">${T('ปิด/ย้ายออก','Closed')}</span>`;
  const r = machineReq(id);
  const need = machineRequiredTotal(id);
  const eff = effectiveAssigned(id);
  const bodies = operatorsFor(id).length;
  const shared = workersCoveringSlot(id).filter(isSharedWorker);
  const cls = eff < need - 0.001 ? 'short' : (eff > need + 0.001 ? 'over' : '');
  const detail = machineNeedsNightShift(id) ? `☀${fmtReq(r.day)} 🌙${fmtReq(r.night)}` : `☀${fmtReq(r.day)}`;
  const tag = ratioTag(id);
  return `<span class="req-pill ${cls}" title="${T('กำลังคนที่ได้จริง / ต้องการ (คนที่ดูแลหลายเครื่องนับตามสัดส่วน)','Effective manpower / required (people covering several machines count pro-rata)')}">👤 ${fmtReq(eff)}/${fmtReq(need)}</span>`
       + (shared.length ? `<span class="share-pill" title="${T('ใช้คนร่วมกับเครื่องอื่น: ','Sharing staff with: ')+shared.map(w=>w.name+' → '+sharedPartnersOf(w,id).map(labelForSlot).join(', ')).join(' | ')}">🔗 ${T('ใช้คนร่วม','shared')} ${bodies} ${T('คน','ppl')}</span>` : '')
       + `<span style="color:var(--grey-txt);font-weight:700;">${detail}</span>`
       + (tag ? `<span class="req-pill" style="background:#EDE7FB;color:#5B3FBF;" title="${T('พนักงาน 1 คนดูแลหลายเครื่อง','One operator covers several machines')}">${tag}</span>` : '');
}
function updateTileReqLine(tile, id){
  const line = tile.querySelector('.req-line');
  if(line) line.innerHTML = reqLineInner(id);
  tile.querySelectorAll('.shift-col-lbl[data-shift]').forEach(lbl=>{
    const sh = lbl.dataset.shift;
    const need = machineReq(id)[sh];
    const have = effectiveAssignedShift(id, sh);
    const mini = lbl.querySelector('.req-mini');
    if(mini){ mini.textContent = fmtReq(have)+'/'+fmtReq(need); mini.className = 'req-mini '+(have<need-0.001?'short':'ok'); }
  });
}
/* red ⚠ marker on any card holding a worker that breaks the RBA limits */
function decorateTileWarnings(tile, slotId, kind){
  const old = tile.querySelector('.rba-tile-badge');
  if(old) old.remove();
  const oldP = tile.querySelector('.preg-tile-badge');
  if(oldP) oldP.remove();
  const pregHere = workersCoveringSlot(slotId).filter(w=>isPregnant(w) &&
      (kind!=='machine' || (machineNeedsNightShift(slotId) && effectiveShift(w, slotId, state.weekStart)==='night')));
  tile.classList.toggle('preg-warn', pregHere.length>0);
  if(pregHere.length>0){
    const pb = document.createElement('div');
    pb.className = 'preg-tile-badge';
    pb.textContent = '🤰 ' + (kind==='machine' ? T('กะดึก!','night!') : T('ตั้งครรภ์','pregnant'));
    pb.title = T('ห้ามให้พนักงานตั้งครรภ์ทำงานกะกลางคืน: ','Pregnant staff must not work nights: ') + pregHere.map(w=>w.name).join(', ');
    tile.appendChild(pb);
  }
  const over = workersCoveringSlot(slotId).filter(w=>rbaOverSet.has(w.id));
  tile.classList.toggle('rba-warn', over.length>0);
  if(over.length>0){
    const b = document.createElement('div');
    b.className = 'rba-tile-badge';
    b.textContent = '⚠ RBA' + (over.length>1 ? ' ×'+over.length : '');
    b.title = T('ทำงานเกินเกณฑ์ RBA: ','Exceeds RBA limits: ') + over.map(w=>w.name+' ('+workerWeeklyHours(w).total.toFixed(1)+'h)').join(', ');
    tile.appendChild(b);
  }
}

function renderMachineTile(m){
  const status = machineStatus(m.id);
  const tile = document.createElement('div');
  tile.className = 'machine-tile status-'+status;
  tile.dataset.machineTileId = m.id;
  tile.title = T('คลิกที่เครื่องเพื่อกำหนดจำนวนคนที่ต้องการ / โซน / สถานะ','Click the machine to set required headcount / zone / status');
  tile.addEventListener('click', (e)=>{
    // ignore clicks already handled by an inner control
    if(e.target.closest('[data-machine-drop]')) return;      // drop slots handle their own click
    if(e.target.closest('.avatar-chip')) return;
    if(e.target.closest('.jig-tile')) return;
    if(e.target.closest('.editable-label')) return;
    if(e.target.closest('input')) return;
    if(e.target.closest('.region-drag-handle')) return;
    if(e.target.closest('.region-resize-grip')) return;
    if(state.selectedJig){
      const jig = state.jigs.find(j=>j.id===state.selectedJig);
      if(jig){
        jig.machineId = m.id;
        const r = tile.getBoundingClientRect();
        if(r.width>10) jig.pos = { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
        jigPos(jig);
      }
      state.selectedJig = null;
      document.querySelectorAll('[data-jig-layer]').forEach(l=>renderJigLayerInto(l, l.dataset.jigLayer));
      const tray = document.getElementById('jig-tray');
      if(tray) renderJigTrayInto(tray);
      persistLocal(); scheduleCloudSave();
      return;
    }
    if(state.selectedChip){ reportAssignResult(addSlotToWorker(state.selectedChip, m.id, 'day')); state.selectedChip=null; afterAssignmentChange(); return; }
    openDetailPanel(m.id);
  });
  const weeklyShifts = machineWeeklyShiftTotal(m.id);
  const decom = isDecommissioned(m.id);

  const idLine = document.createElement('div'); idLine.className='mid';
  idLine.appendChild(editableLabel(()=>state.labels.machine[m.id], v=>{state.labels.machine[m.id]=v;}));
  tile.appendChild(idLine);

  if(!decom && machineRequiresSaturdayOT(m.id)){
    const otBadge = document.createElement('div');
    otBadge.className='ot-sat-badge';
    otBadge.textContent = T('OT เสาร์','Sat OT');
    otBadge.title = T('เครื่องนี้ต้องผลิตวันเสาร์ (นับเป็น OT)','This machine must run on Saturday (counts as OT)');
    tile.appendChild(otBadge);
  }

  tile.insertAdjacentHTML('beforeend', MACHINE_ICON_SVG);

  const needsNight = !decom && machineNeedsNightShift(m.id);
  if(needsNight){
    const shiftWrap = document.createElement('div'); shiftWrap.className='shift-split';
    const dayCol = document.createElement('div'); dayCol.className='shift-col';
    dayCol.innerHTML = `<div class="shift-col-lbl" data-shift="day">☀ ${T('วัน','Day')} <span class="req-mini ${effectiveAssignedShift(m.id,'day')<machineReq(m.id).day-0.001?'short':'ok'}">${fmtReq(effectiveAssignedShift(m.id,'day'))}/${fmtReq(machineReq(m.id).day)}</span></div>`;
    const dayDrop = document.createElement('div'); dayDrop.className='slot-drop shift-drop';
    dayCol.appendChild(dayDrop);
    const nightCol = document.createElement('div'); nightCol.className='shift-col';
    nightCol.innerHTML = `<div class="shift-col-lbl" data-shift="night">🌙 ${T('คืน','Night')} <span class="req-mini ${effectiveAssignedShift(m.id,'night')<machineReq(m.id).night-0.001?'short':'ok'}">${fmtReq(effectiveAssignedShift(m.id,'night'))}/${fmtReq(machineReq(m.id).night)}</span></div>`;
    const nightDrop = document.createElement('div'); nightDrop.className='slot-drop shift-drop';
    nightCol.appendChild(nightDrop);
    shiftWrap.appendChild(dayCol); shiftWrap.appendChild(nightCol);
    tile.appendChild(shiftWrap);
    renderAssignedInto(dayDrop, m.id, true, 'day');
    registerMachineDrop(dayDrop, m.id, 'day');
    renderAssignedInto(nightDrop, m.id, true, 'night');
    registerMachineDrop(nightDrop, m.id, 'night');
  } else {
    const opSlot = document.createElement('div'); opSlot.className='slot-drop';
    tile.appendChild(opSlot);
    renderAssignedInto(opSlot, m.id, true, 'day');
    registerMachineDrop(opSlot, m.id, 'day');
  }

  const reqLine = document.createElement('div');
  reqLine.className = 'req-line';
  reqLine.innerHTML = reqLineInner(m.id);
  reqLine.title = T('จำนวนคนที่ต้องการของเครื่องนี้ — คลิกที่เครื่องเพื่อแก้ไข','Required headcount for this machine — click the machine to edit');
  tile.appendChild(reqLine);

  const jigLayer = document.createElement('div');
  jigLayer.className = 'jig-layer';
  jigLayer.dataset.jigLayer = m.id;
  tile.appendChild(jigLayer);
  tile.dataset.jigDrop = m.id;

  if(!decom && weeklyShifts>0){
    const dayVals = DAY_KEYS.map(d=>state.plan[m.id][d]);
    const all2 = dayVals.every(v=>v===2), all1 = dayVals.every(v=>v===1);
    const pill = document.createElement('div');
    if(all2){
      pill.className='shifts-pill shift-2';
      pill.innerHTML = '☀🌙 '+T('2 กะ','2-Shift');
    } else if(all1){
      pill.className='shifts-pill shift-1';
      pill.innerHTML = '☀ '+T('1 กะ','1-Shift');
    } else {
      pill.className='shifts-pill shift-mixed';
      pill.innerHTML = '◐ '+T('ผสม','Mixed');
    }
    tile.appendChild(pill);
  }
  if(decom){
    const x = document.createElement('div'); x.className='decom-x'; x.textContent='⦸';
    tile.appendChild(x);
  }

  renderJigLayerInto(jigLayer, m.id);
  decorateTileWarnings(tile, m.id, 'machine');
  return tile;
}

      <button id="bulk-weekday2weekend1">${T('จ-ศ 2 กะ / ส-อา 1 กะ','Mon-Fri 2 shifts / Sat-Sun 1 shift')}</button>
    </div>
    <div class="plan-table-wrap">
      <table class="plan-table">
        <thead><tr><th style="text-align:left;">${T('เครื่อง','Machine')}</th>${dayLabelsShort().map(d=>`<th>${d}</th>`).join('')}<th>${T('รวม/สัปดาห์','Total/week')}</th></tr></thead>
        <tbody id="plan-tbody"></tbody>
      </table>
    </div>
  `;
  const tbody = document.getElementById('plan-tbody');
  MACHINES.forEach(m=>{
    const decom = isDecommissioned(m.id);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="mname">${state.labels.machine[m.id]}${decom?` <span class="hint">(${T('ปิด','closed')})</span>`:''}</td>` +
      DAY_KEYS.map(d=>{ const v=state.plan[m.id][d]; return `<td><button class="shift-btn s${v}" data-m="${m.id}" data-d="${d}" ${decom?'disabled':''}>${v}</button></td>`; }).join('') +
      `<td style="font-weight:700;">${decom?'—':machineWeeklyShiftTotal(m.id)}</td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.shift-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const m=btn.dataset.m,d=btn.dataset.d; state.plan[m][d]=state.plan[m][d]===1?2:1; renderPlanTab(); });
  });
  document.getElementById('bulk-all2').addEventListener('click', ()=>{ MACHINES.forEach(m=>DAY_KEYS.forEach(d=>state.plan[m.id][d]=2)); renderPlanTab(); });
  document.getElementById('bulk-all1').addEventListener('click', ()=>{ MACHINES.forEach(m=>DAY_KEYS.forEach(d=>state.plan[m.id][d]=1)); renderPlanTab(); });
  document.getElementById('bulk-weekday2weekend1').addEventListener('click', ()=>{
    MACHINES.forEach(m=>DAY_KEYS.forEach(d=>{ state.plan[m.id][d] = (d==='sat'||d==='sun')?1:2; })); renderPlanTab();
  });
}

/* ============================================================
   TAB 3: SKILL MATRIX
   ============================================================ */
function renderSkillTab(){
  const el = document.getElementById('tab-skill');
  const active = MACHINES.filter(m=>!isDecommissioned(m.id));
  const critical = active.filter(m=>machineStatus(m.id)==='critical');
  const shared = active.filter(m=>machineStatus(m.id)==='shared');
  const ok = active.filter(m=>machineStatus(m.id)==='ok');
  const nightGap = active.filter(m=>machineNeedsNightShift(m.id) && operatorsForShift(m.id,'night').length===0 && operatorsFor(m.id).length>0);
  el.innerHTML = `
    <div class="summary-bar" style="grid-template-columns:repeat(4,1fr);">
      <div class="summary-card"><div class="lbl">${T('ไม่มีคนคุมเลย','No operator at all')}</div><div class="big danger">${critical.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('ขาดคนกะกลางคืน','Missing night operator')}</div><div class="big danger">${nightGap.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('คุมร่วมหลายเครื่อง','Shared coverage')}</div><div class="big amber">${shared.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('มีคนคุมเฉพาะเครื่อง','Dedicated operator')}</div><div class="big ok">${ok.length}</div></div>
    </div>
    <div class="group-label">${T('เครื่องที่ไม่มีคนคุม (วิกฤต)','Machines with no operator (critical)')}</div>
    <div class="station-grid" id="skill-critical"></div>
    <div class="group-label">${T('เครื่องเดิน 2 กะ แต่ขาดคนกะกลางคืน','Runs 2 shifts but missing a night operator')}</div>
    <div class="station-grid" id="skill-nightgap"></div>
    <div class="group-label">${T('เครื่องที่คุมร่วมกับเครื่องอื่น (Single-Person Risk)','Machines sharing an operator (single-person risk)')}</div>
    <div class="station-grid" id="skill-shared"></div>
    <div class="group-label">${T('เครื่องที่มีคนคุมเฉพาะ','Machines with dedicated operator')}</div>
    <div class="station-grid" id="skill-ok"></div>
  `;
  fillRiskGrid('skill-critical', critical, 'critical');
  fillRiskGrid('skill-nightgap', nightGap, 'nightgap');
  fillRiskGrid('skill-shared', shared, 'shared');
  fillRiskGrid('skill-ok', ok, 'ok');
}
function fillRiskGrid(containerId, machines, kind){
  const grid = document.getElementById(containerId);
  if(machines.length===0){ grid.innerHTML = `<div class="hint" style="padding:6px 2px;">— ${T('ไม่มี','None')} —</div>`; return; }
  machines.forEach(m=>{
    const worker = operatorsFor(m.id)[0];
    let txt = '';
    if(kind==='critical') txt = T('ยังไม่ได้จัดคนดูแล','Not yet assigned');
    else if(kind==='nightgap'){
      const dayOp = operatorsForShift(m.id,'day')[0];
      txt = dayOp ? T('มีคนกะวัน ('+dayOp.name+') แต่ไม่มีคนกะคืน','Has day operator ('+dayOp.name+') but no night operator') : T('ไม่มีคนกะคืน','No night operator');
    }
    else if(kind==='shared') txt = worker ? `${worker.name} ${T('ดูแลร่วมกับ','also covers')} ${worker.slots.filter(x=>x!==m.id).map(labelForSlot).join(', ')}` : '-';
    else txt = worker ? `${worker.name} ${T('ดูแลเครื่องนี้เพียงเครื่องเดียว','covers only this machine')}` : '-';
    const card = document.createElement('div');
    card.className = 'risk-card'+(kind!=='ok'?' spof':'');
    const kindLabel = kind==='critical'?T('วิกฤต','Critical'):(kind==='nightgap'?T('ขาดกะคืน','Night gap'):(kind==='shared'?T('เสี่ยง','At risk'):T('ปกติ','Normal')));
    card.innerHTML = `<div class="mname">${state.labels.machine[m.id]}</div><div class="rtxt">${txt}</div>
      <div style="margin-top:6px;"><span class="status-pill ${kind==='nightgap'?'critical':kind}">${kindLabel}</span></div>`;
    grid.appendChild(card);
  });
}


/* ============================================================
   TAB 4: ตารางเวลาทำงาน
   ============================================================ */
function parseDateLocal(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDM(dt){ return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0'); }
function weekDates(weekStartStr){
  const start = parseDateLocal(weekStartStr);
  return DAY_KEYS.map((k,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); return d; });
}
function getRosterFor(workerId){
  const defOT = (state.defaultOT===undefined||state.defaultOT===null) ? 2 : state.defaultOT;
  if(!state.roster[workerId]){
    const days = {};
    DAY_KEYS.forEach(d=>{ days[d] = { off: d==='sun', ot: defOT, otOn: d!=='sun' }; });
    state.roster[workerId] = days;
    return days;
  }
  const days = state.roster[workerId];
  DAY_KEYS.forEach(d=>{
    if(!days[d]) days[d] = { off: d==='sun', ot: defOT, otOn: d!=='sun' };
    if(days[d].ot === undefined || days[d].ot === null) days[d].ot = defOT;
    if(days[d].otOn === undefined) days[d].otOn = (Number(days[d].ot)||0) > 0;  // migrate old data
  });
  return days;
}
function applyDefaultOTToAll(){
  const defOT = (state.defaultOT===undefined||state.defaultOT===null) ? 2 : state.defaultOT;
  state.workers.forEach(w=>{
    const r = getRosterFor(w.id);
    DAY_KEYS.forEach(d=>{ if(!r[d].off){ r[d].ot = defOT; r[d].otOn = true; } });
  });
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

function renderRosterTab(){
  const el = document.getElementById('tab-roster');
  const dates = weekDates(state.weekStart);
  const assigned = state.workers.filter(w=>w.slots.length>0);
  let passCount=0, failCount=0;
  const cardsHtml = assigned.map(w=>{
    const roster = getRosterFor(w.id);
    let total=0;
    const grp = BREAK_GROUPS[w.breakGroup];
    const dayCells = DAY_KEYS.map((d,i)=>{
      const day = roster[d];
      const ot = effectiveOT(day, w);
      const hrs = day.off ? 0 : (BASE_HOURS_PER_SHIFT+ot);
      total += hrs;
      return `
        <div class="wwc-day ${day.off?'off':''} ${(!day.off && day.otOn===false)?'ot-off':''}">
          <div class="lbl">${dayLabelsShort()[i]} ${fmtDM(dates[i])}</div>
          ${day.off ? `<div class="basehr">${T('หยุด','Off')}</div>` :
            `<div class="basehr">${BASE_HOURS_PER_SHIFT.toFixed(2)} ${T('ชม.','h')}</div>
             ${isPregnant(w)
               ? `<div class="otwrap" style="color:#D6336C;font-size:9px;font-weight:800;">🤰 ${T('ห้าม OT','No OT')}</div>`
               : `<div class="otwrap">
               <label class="ot-check" title="${T('ติ๊กถ้าทำ OT วันนี้','Tick if OT is worked on this day')}">
                 <input type="checkbox" data-oton-worker="${w.id}" data-oton-day="${d}" ${day.otOn!==false?'checked':''}>
               </label>
               <span style="font-size:10px;font-weight:700;">OT</span>
               <input type="number" min="0" max="${MAX_OT_PER_DAY}" step="0.5" value="${day.ot}" data-worker="${w.id}" data-day="${d}" class="ot-input" ${day.otOn===false?'disabled':''}>
             </div>`}`}
          <div class="daytot">${hrs.toFixed(2)}h</div>
          <label style="display:block;margin-top:3px;font-size:8.5px;color:var(--grey-txt);">
            <input type="checkbox" data-off-worker="${w.id}" data-off-day="${d}" ${day.off?'checked':''} style="transform:scale(.8);"> ${T('หยุด','Off')}
          </label>
        </div>`;
    }).join('');
    const hoursInfo = workerWeeklyHours(w);
    const noRest = hoursInfo.offDays===0;
    const pass = total<=RBA_WEEKLY_CAP && !noRest;
    if(pass) passCount++; else failCount++;
    return `
      <div class="worker-week-card">
        <div class="wwc-head">
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="avatar-circle" style="width:20px;height:20px;background:${w.color};border-color:${grp?grp.color:'#999'};">${avatarSvg(w.avatar)}</span>
            <b>${w.name}</b>${workerFlag(w)!=='none'?`<span class="wflag" title="${flagLabel(workerFlag(w))}">${WORKER_FLAGS[workerFlag(w)].emoji}</span>`:''}
          </span>
          <span class="hint">${w.slots.map(labelForSlot).join(', ')} ${grp?('• '+breakGroupLabel(w.breakGroup)):''}${w.rotation&&w.rotation.enabled?(' • 🔁 '+(w.slots.some(s=>isMachineSlot(s)&&machineNeedsNightShift(s))?(effectiveShift(w, w.slots.find(s=>isMachineSlot(s)&&machineNeedsNightShift(s)), state.weekStart)==='night'?T('กะคืนสัปดาห์นี้','Night this week'):T('กะวันสัปดาห์นี้','Day this week')):T('หมุนเวียน','Rotating'))):''}</span>
        </div>
        <div class="wwc-days">${dayCells}</div>
        <div class="wwc-foot">
          <span class="tothrs">${total.toFixed(2)} ${T('ชม./สัปดาห์','h/week')}
            <span class="hint" style="font-family:var(--font-body);font-size:10.5px;">(OT ${hoursInfo.otTotal.toFixed(1)} ${T('ชม.','h')} • ${T('หยุด','off')} ${hoursInfo.offDays} ${T('วัน','d')})</span>
          </span>
          <span class="pass-badge ${pass?'pass':'fail'}">${
            pass ? T('✓ ผ่านเกณฑ์ RBA','✓ Meets RBA')
                 : (total>RBA_WEEKLY_CAP ? T('✗ เกิน '+RBA_WEEKLY_CAP+' ชม.','✗ Exceeds '+RBA_WEEKLY_CAP+'h') : T('✗ ไม่มีวันหยุดใน 7 วัน','✗ No rest day in 7 days'))
          }</span>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    ${rbaAlertHtml()}
    ${restrictionAlertHtml()}
    <div class="roster-toolbar">
      <label>${T('สัปดาห์เริ่มวันที่','Week starting')}</label>
      <input type="date" id="week-start-input" value="${state.weekStart}">
      <span class="hint">${fmtDM(dates[0])} – ${fmtDM(dates[6])}</span>
      <span style="width:1px;height:26px;background:var(--border);"></span>
      <label>${T('ค่าเริ่มต้น OT (ชม./วัน)','Default OT (h/day)')}</label>
      <input type="number" id="default-ot-input" min="0" max="${MAX_OT_PER_DAY}" step="0.5" value="${(state.defaultOT===undefined?2:state.defaultOT)}"
             style="width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;text-align:center;">
      <button class="reset-btn" id="apply-default-ot" style="background:var(--blue);">${T('ใช้กับทุกคน','Apply to everyone')}</button>
    </div>
    <div class="summary-bar" style="grid-template-columns:repeat(3,1fr);">
      <div class="summary-card"><div class="lbl">${T('พนักงานที่จัดกะแล้ว','Employees scheduled')}</div><div class="big">${assigned.length}</div></div>
      <div class="summary-card"><div class="lbl">${T('ผ่านเกณฑ์ RBA','Meet RBA')}</div><div class="big ok">${passCount}</div></div>
      <div class="summary-card"><div class="lbl">${T('เกินเกณฑ์ RBA','Exceed RBA limits')}</div><div class="big ${failCount?'danger':'ok'}">${failCount}</div></div>
    </div>
    <div class="hint" style="margin-bottom:10px;">
      ${T('สูตร: ทำงานปกติ '+BASE_HOURS_PER_SHIFT+' ชม./วัน (8 ชม. + พักเบรก 35 นาที ตามระบบ RMT Connect) + OT ที่ติ๊กไว้','Formula: normal work '+BASE_HOURS_PER_SHIFT+'h/day (8h + 35min break per RMT Connect) + the OT you tick')}<br>
      ${T('ตัวอย่าง: ทำงาน 6 วัน + OT '+((state.defaultOT===undefined?2:state.defaultOT))+' ชม./วัน = '+(6*(BASE_HOURS_PER_SHIFT+(state.defaultOT===undefined?2:state.defaultOT))).toFixed(2)+' ชม./สัปดาห์ (เพดาน RBA = '+RBA_WEEKLY_CAP+' ชม.) — ติ๊กออกในวันที่ไม่ทำ OT เพื่อลดชั่วโมง','Example: 6 working days + '+((state.defaultOT===undefined?2:state.defaultOT))+'h OT/day = '+(6*(BASE_HOURS_PER_SHIFT+(state.defaultOT===undefined?2:state.defaultOT))).toFixed(2)+'h/week (RBA cap = '+RBA_WEEKLY_CAP+'h) — untick the days without OT to bring it down')}
    </div>
    ${cardsHtml || `<div class="hint">${T('ยังไม่มีพนักงานที่จัดตำแหน่งในแท็บ "ผังโรงงาน"','No employees assigned yet in the "Floor Plan" tab')}</div>`}
  `;
  document.getElementById('week-start-input').addEventListener('change', e=>{ state.weekStart=e.target.value; renderRosterTab(); });
  document.getElementById('default-ot-input').addEventListener('change', e=>{
    state.defaultOT = clamp(parseFloat(e.target.value)||0, 0, MAX_OT_PER_DAY);
    persistLocal(); scheduleCloudSave();
  });
  document.getElementById('apply-default-ot').addEventListener('click', ()=>{
    const v = document.getElementById('default-ot-input').value;
    state.defaultOT = clamp(parseFloat(v)||0, 0, MAX_OT_PER_DAY);
    if(!confirm(T('ตั้ง OT = '+state.defaultOT+' ชม. ให้พนักงานทุกคนในทุกวันที่ไม่ได้หยุด?','Set OT = '+state.defaultOT+'h for every employee on all non-off days?'))) return;
    applyDefaultOTToAll();
    refreshRbaSet();
    renderRosterTab();
    persistLocal(); scheduleCloudSave();
  });
  el.querySelectorAll('.ot-input').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const r=getRosterFor(e.target.dataset.worker);
      r[e.target.dataset.day].ot = clamp(parseFloat(e.target.value)||0,0,MAX_OT_PER_DAY);
      refreshRbaSet(); renderRosterTab(); persistLocal(); scheduleCloudSave();
    });
  });
  el.querySelectorAll('[data-oton-worker]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const r=getRosterFor(e.target.dataset.otonWorker);
      r[e.target.dataset.otonDay].otOn = e.target.checked;
      refreshRbaSet(); renderRosterTab(); persistLocal(); scheduleCloudSave();
    });
  });
  el.querySelectorAll('[data-off-worker]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const r=getRosterFor(e.target.dataset.offWorker);
      r[e.target.dataset.offDay].off = e.target.checked;
      refreshRbaSet(); renderRosterTab(); persistLocal(); scheduleCloudSave();
    });
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  state = freshState();
  restoreLocal();      // bring back whatever this device was last working on
  migrateState();
  renderShell();
  renderTabs();
  initFirebase();
  document.addEventListener('keydown', (e)=>{
    if(state.activeTab !== 'floor') return;
    const tg = e.target;
    if(tg && tg.nodeType===1 && typeof tg.matches==='function' && tg.matches('input,textarea,select')) return;
    if(e.key === 'Escape'){ clearRegionEditing(); return; }
    if(!state.selectedRegions.length) return;
    const g = e.shiftKey ? 1 : (state.snapGrid || 10);
    let dx=0, dy=0;
    if(e.key==='ArrowLeft') dx=-g;
    else if(e.key==='ArrowRight') dx=g;
    else if(e.key==='ArrowUp') dy=-g;
    else if(e.key==='ArrowDown') dy=g;
    else return;
    e.preventDefault();
    nudgeSelection(dx,dy);
  });
  window.addEventListener('beforeunload', ()=>{
    try{ localStorage.setItem(LS_CURRENT, serializeState()); }catch(err){}
  });
}
document.addEventListener('DOMContentLoaded', init);

})();

</script>
