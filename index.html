<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manpower & Shift Simulation — Injection Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --charcoal:#36454F; --charcoal-dk:#262F36;
  --offwhite:#F2F2F2; --paper:#FAFBFB;
  --red:#D71920; --red-dk:#B5141A;
  --green:#2E7D52; --green-bg:#E7F3EC;
  --amber:#C9821A; --amber-bg:#FBF1E1;
  --blue:#2C5E8A; --blue-bg:#E7EFF6;
  --white:#FFFFFF; --grey-txt:#5B6670; --border:#DADFE3;
  --factory-green:#1E5631; --factory-green-dk:#153F24;
  --zone-cream:#F5F0DA; --zone-mint:#E9F3EA; --zone-border:#6B1F22;
  --font-head:'Space Grotesk','Noto Sans Thai',sans-serif;
  --font-body:'Inter','Noto Sans Thai',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--paper);color:var(--charcoal);-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;}

/* Header */
header.app-head{
  background:var(--charcoal-dk); color:var(--white);
  padding:16px 22px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:8px; border-bottom:3px solid var(--red);
}
.app-head .brand{display:flex;align-items:center;gap:10px;}
.app-head .sq{width:13px;height:13px;background:var(--red);flex:none;}
.app-head h1{font-family:var(--font-head);font-size:17px;margin:0;font-weight:700;}
.app-head .sub{font-size:11.5px;color:#B7C0C8;margin-top:2px;}
.app-head .meta{font-size:11px;color:#9AA3AB;text-align:right;line-height:1.5;}
.lang-switch{display:flex;border:1.5px solid #4A5560;border-radius:7px;overflow:hidden;}
.lang-switch button{background:transparent;border:none;color:#C7CCD1;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.lang-switch button.active{background:var(--red);color:#fff;}

nav.tabs{display:flex;background:var(--charcoal);padding:0 22px;gap:2px;overflow-x:auto;}
nav.tabs button{
  background:transparent;border:none;color:#C7CCD1;padding:12px 16px;font-size:12.8px;font-weight:600;
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;
}
nav.tabs button:hover{background:rgba(255,255,255,0.06);}
nav.tabs button.active{color:#fff;border-bottom-color:var(--red);background:rgba(255,255,255,0.04);}
nav.tabs button .tag{font-family:var(--font-head);font-size:9.5px;color:var(--red);background:rgba(215,25,32,.15);padding:2px 6px;border-radius:3px;}

main.tabpanels{padding:18px 20px 60px;max-width:1500px;margin:0 auto;}
.tabsection{display:none;} .tabsection.active{display:block;}

.summary-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
@media (max-width:900px){.summary-bar{grid-template-columns:repeat(2,1fr);}}
.summary-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:11px 13px;}
.summary-card .lbl{font-size:10px;color:var(--grey-txt);text-transform:uppercase;letter-spacing:.4px;}
.summary-card .big{font-family:var(--font-head);font-size:22px;font-weight:700;margin-top:2px;}
.summary-card .big.danger{color:var(--red);} .summary-card .big.ok{color:var(--green);} .summary-card .big.amber{color:var(--amber);}
.summary-card .sub{font-size:10px;color:#8A939B;margin-top:2px;}

/* ---------- Floor plan ---------- */
.floor-toolbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
#pool-tray-wrap{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
#pool-tray-wrap h4{margin:0 0 6px;font-family:var(--font-head);font-size:11.5px;text-transform:uppercase;color:var(--grey-txt);letter-spacing:.5px;}
#pool-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;background:var(--offwhite);border:2px dashed var(--border);border-radius:7px;}
#pool-tray.empty::after{content:"ลากคนกลับมาไว้ตรงนี้ได้";font-size:11px;color:#9AA3AB;align-self:center;}

.factory-floor-canvas{
  position:relative;
  background:var(--factory-green);
  border:4px solid var(--factory-green-dk);
  border-radius:10px;
  overflow:auto;
  min-height:400px;
}
.canvas-zoom-sizer{ position:relative; }
.canvas-zoom-content{ transform-origin: 0 0; position:absolute; top:0; left:0; }
.zoom-toolbar{
  display:flex; align-items:center; gap:8px; margin-bottom:8px; background:#fff; border:1px solid var(--border);
  border-radius:8px; padding:6px 10px; width:fit-content;
}
.zoom-toolbar button{
  width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--offwhite);
  font-size:16px; font-weight:700; cursor:pointer; color:var(--charcoal); display:flex; align-items:center; justify-content:center;
}
.zoom-toolbar button:hover{background:var(--charcoal); color:#fff;}
.zoom-toolbar .zoom-pct{font-family:var(--font-head); font-weight:700; font-size:12.5px; min-width:44px; text-align:center;}
.floor-block{display:flex;flex-direction:column;gap:12px;}

.zone-box{
  height:100%;
  background:var(--zone-cream);
  border:2px solid var(--zone-border);
  border-radius:6px;
  padding:10px;
  width:100%; box-sizing:border-box; position:relative;
}
.zone-box.support{background:var(--zone-mint);}
.zone-title{font-family:var(--font-head);font-size:11px;font-weight:700;color:var(--zone-border);margin-bottom:8px;letter-spacing:.3px;}

.machine-tile{
  width:100%; height:auto; min-height:100%; box-sizing:border-box;
  background:var(--white);
  border:1.5px solid #B9C0C6;
  border-radius:7px;
  padding:6px 6px 24px;
  position:relative;
  cursor:pointer;
  transition:box-shadow .12s, border-color .12s;
}
.ot-sat-badge{
  position:absolute; top:2px; right:2px; background:var(--red); color:#fff;
  font-size:8px; font-weight:800; padding:2px 5px; border-radius:4px; z-index:2;
  letter-spacing:.2px;
}
.shift-split{display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:4px;}
.shift-col{background:var(--offwhite); border-radius:5px; padding:3px;}
.shift-col-lbl{font-size:8.5px; font-weight:700; text-align:center; color:var(--grey-txt); margin-bottom:2px;}
.shift-drop{min-height:30px;border-radius:4px;}
.region-item{position:absolute; overflow:visible; box-shadow:0 3px 10px rgba(0,0,0,.25); border-radius:8px; min-width:40px; min-height:40px;}
.region-resize-grip{
  position:absolute; right:-2px; bottom:-2px; width:16px; height:16px; cursor:nwse-resize; z-index:6;
  background:linear-gradient(135deg, transparent 45%, rgba(0,0,0,.30) 45%, rgba(0,0,0,.30) 100%);
  border-radius:0 0 7px 0; touch-action:none;
}
.region-resize-grip:hover{background:linear-gradient(135deg, transparent 45%, var(--red) 45%);}
.region-drag-handle{
  position:absolute; top:6px; right:6px; width:20px; height:16px; cursor:grab;
  font-size:9px; line-height:16px; text-align:center; color:#9AA3AB; border-radius:3px;
  touch-action:none; z-index:3; letter-spacing:-2px; background:rgba(255,255,255,.7);
}
.region-drag-handle:hover{background:var(--offwhite); color:var(--charcoal);}
.support-tile.banner{width:100%;}
.machine-tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.18);border-color:var(--charcoal);}
.machine-tile.status-critical{border-color:var(--red);box-shadow:0 0 0 2px rgba(215,25,32,.18);}
.machine-tile.status-shared{border-color:var(--amber);}
.machine-tile.status-ok{border-color:var(--green);}
.machine-tile.status-decommissioned{opacity:.42;}
.machine-tile .mid{font-family:var(--font-head);font-size:11.5px;font-weight:700;text-align:center;}
.machine-tile .glyph{
  width:100%;height:34px;margin:4px 0;
  background:repeating-linear-gradient(180deg,#8FA0AC 0 4px,#AAB8C2 4px 8px);
  border-radius:3px;position:relative;
}
.machine-tile .slot-drop{min-height:34px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;border-radius:5px;}
.machine-tile .slot-drop.dragover{outline:2px dashed var(--red);border-radius:5px;}
.machine-tile .badges{position:absolute;top:3px;right:3px;display:flex;gap:2px;}
.machine-tile .badge-dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.25);}
.machine-tile .badge-dot.fix{background:var(--red);}
.machine-tile .badge-dot.move{background:#5FBF6E;}
.machine-tile .no-relief{font-size:8.5px;color:var(--amber);margin-top:3px;text-align:center;}
.machine-tile .decom-x{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--red);pointer-events:none;font-weight:900;
}
.machine-tile .shifts-pill{
  position:absolute; left:0; right:0; bottom:0;
  font-size:10.5px; font-family:var(--font-head); font-weight:800;
  padding:3px 4px; text-align:center; border-radius:0 0 6px 6px;
  letter-spacing:.2px;
}
.machine-tile .shifts-pill.shift-2{ background:#1857A4; color:#fff; }
.machine-tile .shifts-pill.shift-1{ background:#E8A020; color:#3A2405; }
.machine-tile .shifts-pill.shift-mixed{ background:#8B5CF6; color:#fff; }

.support-tile{
  width:100%; height:auto; min-height:100%; box-sizing:border-box;
  background:var(--white); border:1.5px solid #B9C0C6; border-radius:7px; padding:8px; position:relative;
}
.labor-badge{
  display:inline-block; font-size:8.5px; font-weight:800; padding:2px 7px; border-radius:8px;
  letter-spacing:.3px; margin-bottom:5px;
}
.labor-badge.direct{background:#1857A4; color:#fff;}
.labor-badge.indirect{background:#C9631A; color:#fff;}
.custom-area-box{
  border:2px dashed #999; border-radius:6px; padding:10px; width:100%; height:auto; min-height:100%; box-sizing:border-box;
}
.support-tile .stitle{font-size:11px;font-weight:700;margin-bottom:5px;}
.support-tile .slot-drop{min-height:40px;display:flex;flex-wrap:wrap;gap:4px;border-radius:5px;}
.slot-drop.dragover{outline:2px dashed var(--red); outline-offset:1px; background:rgba(215,25,32,.10);}

/* Chips */
.chip{
  background:var(--white); border:1.5px solid var(--charcoal); border-radius:14px;
  padding:3px 8px 3px 4px; font-size:10.5px; font-weight:600; display:inline-flex; align-items:center; gap:4px;
  cursor:grab; touch-action:none; user-select:none; transition:box-shadow .12s;
}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--charcoal);color:#fff;font-size:7px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-head);flex:none;}
.chip:hover{box-shadow:0 2px 6px rgba(0,0,0,.15);}
.chip.selected{border-color:var(--red);box-shadow:0 0 0 2px rgba(215,25,32,.25);}
.chip.dragging{opacity:.35;}
.chip.small{font-size:9px;padding:2px 6px 2px 3px;}
.chip.small .dot{width:12px;height:12px;font-size:6px;}
.chip-ghost{position:fixed;pointer-events:none;z-index:999;opacity:.92;transform:translate(-50%,-50%) scale(1.05);}

.legend-box{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11.5px;align-self:flex-start;height:auto;}
.legend-box h4{margin:0 0 8px;font-family:var(--font-head);font-size:11px;text-transform:uppercase;color:var(--grey-txt);}
.legend-row{display:flex;align-items:center;gap:7px;padding:3px 0;}
.legend-row .sw{width:11px;height:11px;border-radius:50%;flex:none;}

/* Detail panel (slide-over) */
#overlay{position:fixed;inset:0;background:rgba(20,25,28,.45);z-index:50;display:none;}
#overlay.open{display:block;}
#detail-panel{
  position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:#fff;z-index:51;
  box-shadow:-8px 0 24px rgba(0,0,0,.25); transform:translateX(100%); transition:transform .2s ease;
  overflow-y:auto; padding:20px;
}
#detail-panel.open{transform:translateX(0);}
#detail-panel h2{font-family:var(--font-head);font-size:20px;margin:0 0 2px;}
#detail-panel .close-btn{position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--grey-txt);}
.dp-section{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.dp-section h4{font-family:var(--font-head);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--grey-txt);margin:0 0 8px;}
.dp-row{margin-bottom:10px;}
.dp-row label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
.dp-row input[type=text],.dp-row input[type=date],.dp-row select{
  width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;
}
.toggle-btns{display:flex;gap:6px;}
.toggle-btns button{
  flex:1;padding:8px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;
}
.toggle-btns button.active-fix{background:var(--red);color:#fff;border-color:var(--red);}
.toggle-btns button.active-move{background:var(--green);color:#fff;border-color:var(--green);}
.toggle-btns button.active-none{background:var(--charcoal);color:#fff;border-color:var(--charcoal);}
.dp-checkbox{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;}
.relief-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px dashed var(--border);}
.relief-row:last-child{border-bottom:none;}

/* Production plan table */
.plan-table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:8px;}
table.plan-table{border-collapse:collapse;width:100%;font-size:12px;}
table.plan-table th,table.plan-table td{padding:6px 8px;text-align:center;border-top:1px solid var(--border);white-space:nowrap;}
table.plan-table thead th{background:var(--charcoal);color:#fff;position:sticky;top:0;}
table.plan-table td.mname{text-align:left;font-weight:700;position:sticky;left:0;background:#fff;}
.shift-btn{width:34px;height:26px;border-radius:5px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:11px;cursor:pointer;}
.shift-btn.s1{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
.shift-btn.s2{background:#FDE9E9;border-color:var(--red);color:var(--red);}
.shift-btn:disabled{opacity:.35;cursor:not-allowed;}
.bulk-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:12px;}
.bulk-row button{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:11.5px;font-weight:600;}

/* Skill matrix */
.station-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.risk-card{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:10px 11px;}
.risk-card.spof{border-color:var(--red);}
.risk-card .mname{font-family:var(--font-head);font-weight:700;font-size:13px;}
.risk-card .rtxt{font-size:11px;color:var(--grey-txt);margin-top:4px;}
.status-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;}
.status-pill.ok{background:var(--green-bg);color:var(--green);}
.status-pill.over,.status-pill.critical{background:#FBE2E3;color:var(--red);}
.status-pill.shared{background:var(--amber-bg);color:var(--amber);}

/* Roster */
.roster-toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--border);padding:10px 14px;border-radius:8px;}
.roster-toolbar label{font-size:12px;font-weight:700;}
.roster-toolbar input[type=date]{padding:6px 8px;border:1px solid var(--border);border-radius:6px;}
.rweek-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:10px;}
.rweek-cal .dayhead{background:var(--charcoal);color:#fff;text-align:center;padding:8px 4px;font-family:var(--font-head);font-weight:700;font-size:12px;}
.rweek-cal .dayhead.sun{background:var(--red);}
.rweek-cal .dayhead.sat{background:var(--blue);}
.worker-week-card{background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;}
.wwc-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--offwhite);}
.wwc-head b{font-family:var(--font-head);}
.wwc-days{display:grid;grid-template-columns:repeat(7,1fr);}
.wwc-day{border-left:1px solid var(--border);padding:8px 6px;text-align:center;}
.wwc-day:first-child{border-left:none;}
.wwc-day .lbl{font-size:9.5px;color:var(--grey-txt);}
.wwc-day .basehr{font-size:10.5px;margin-top:2px;}
.wwc-day .otwrap{margin-top:4px;display:flex;align-items:center;justify-content:center;gap:3px;}
.wwc-day .otwrap input{width:38px;padding:2px 3px;font-size:10.5px;border:1px solid var(--border);border-radius:4px;text-align:center;}
.wwc-day .daytot{font-family:var(--font-head);font-weight:700;font-size:12px;margin-top:4px;}
.wwc-day.off{background:#F5F5F5;color:#B0B6BB;}
.wwc-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px dashed var(--border);}
.wwc-foot .tothrs{font-family:var(--font-head);font-size:16px;font-weight:700;}
.pass-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;}
.pass-badge.pass{background:var(--green-bg);color:var(--green);}
.pass-badge.fail{background:#FBE2E3;color:var(--red);}

.hint{font-size:11px;color:#8A939B;}
.panel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px;}
.slider-row label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;}
.slider-row .val{font-family:var(--font-head);color:var(--red);font-weight:700;}
.slider-row input[type=range]{width:100%;accent-color:var(--red);}
.reset-btn{background:var(--charcoal);color:#fff;border:none;padding:7px 12px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;height:34px;line-height:20px;box-sizing:border-box;}
.group-label{font-family:var(--font-head);font-size:13px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
.group-label::after{content:"";flex:1;height:1px;background:var(--border);}
footer.app-foot{text-align:center;font-size:11px;color:#9AA3AB;padding:16px;border-top:1px solid var(--border);}

/* ============================================================
   MOBILE RESPONSIVENESS
   ============================================================ */
@media (max-width:900px){
  main.tabpanels{padding:14px 12px 50px;}
  .app-head{padding:12px 14px;}
  .app-head h1{font-size:15px;}
  .app-head .sub{font-size:10.5px;}
  .app-head .meta{display:none;}
  #scenario-btn{padding:8px 10px;font-size:11px;}
  nav.tabs{padding:0 10px;}
  nav.tabs button{padding:11px 12px;font-size:12px;}
}
@media (max-width:480px){
  nav.tabs button span:not(.tag){display:none;}
  nav.tabs button{padding:12px 10px;}
}
@media (max-width:640px){
  .app-head{flex-direction:column;align-items:flex-start;gap:10px;}
  .app-head > div:last-child{width:100%;justify-content:space-between;display:flex;}
  .lang-switch button{padding:8px 10px;}
  .floor-toolbar{flex-direction:column;}
  #pool-tray-wrap,#jig-tray-wrap,.legend-box{min-width:0 !important;width:100%;}
  .summary-bar{grid-template-columns:repeat(2,1fr) !important;}
  .chip-settings-btn{width:24px;height:24px;font-size:13px;}
  .avatar-chip{padding:5px 10px 5px 4px;}
  .avatar-circle{width:28px;height:28px;}
  .avatar-circle svg{width:18px;height:18px;}
  input[type=color]{width:26px !important;height:26px !important;}
  .machine-tile{width:100%;}
  .zone-title input[type=color]{width:26px;height:26px;}
  .shift-btn{width:38px;height:32px;font-size:13px;}
  .ot-input{width:44px !important;height:24px !important;font-size:12px !important;}
  .wwc-days{grid-template-columns:repeat(7,66px); overflow-x:auto;}
  .wwc-day{min-width:66px;}
  #detail-panel{width:100%;max-width:100%;padding:16px;}

/* ============================================================
   CLOUD SYNC / LOGIN
   ============================================================ */
#app.view-only main.tabpanels{ pointer-events:none; user-select:none; }
.cloud-status{
  display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2); border-radius:7px; padding:7px 12px; font-size:11.5px; color:#fff;
  cursor:pointer; white-space:nowrap;
}
.cloud-status .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.cloud-status .dot.on{background:#4ADE80;}
.cloud-status .dot.off{background:#9AA3AB;}
.view-only-banner{
  background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber);
  border-radius:8px; padding:9px 14px; font-size:12.5px; font-weight:600; margin:0 20px 0; display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.view-only-banner button{background:var(--charcoal);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11.5px;font-weight:700;cursor:pointer;}

/* ---------- v3: avatars, machine icon, jigs, editable labels ---------- */
.editable-label{
  border-bottom:1.5px dotted transparent; cursor:text; border-radius:3px; padding:1px 3px;
}
.editable-label:hover{border-bottom-color:var(--red); background:rgba(215,25,32,.06);}
.editable-label input{font:inherit;font-weight:inherit;color:inherit;border:1.5px solid var(--red);border-radius:3px;padding:0 3px;width:100%;background:#fff;}

.avatar-chip{
  display:inline-flex; align-items:center; gap:4px; cursor:grab; touch-action:none; user-select:none;
  background:#fff; border-radius:16px; padding:2px 8px 2px 2px; border:1.5px solid #D6DBDF;
}
.avatar-chip.selected{box-shadow:0 0 0 2px rgba(215,25,32,.3); border-color:var(--red);}
.avatar-chip.dragging{opacity:.35;}
.avatar-circle{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:none; position:relative; border:2.5px solid #999;
}
.avatar-circle svg{width:16px;height:16px;}
.avatar-chip .aname{font-size:10.5px;font-weight:700;color:var(--charcoal);}
.avatar-chip .acount{font-size:8px;background:var(--charcoal);color:#fff;border-radius:6px;padding:0 4px;margin-left:2px;}
.chip-settings-btn{
  border:none;background:var(--offwhite);color:var(--grey-txt);width:18px;height:18px;border-radius:50%;
  font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;margin-left:2px;padding:0;
}
.chip-settings-btn:hover{background:var(--red);color:#fff;}

/* roster grouping */
.roster-filters{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.roster-filters select{
  padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;background:#fff;flex:1;min-width:130px;
}
.bulk-action-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFF6F6;border:1px solid var(--red);
  border-radius:7px;padding:8px 12px;margin-bottom:8px;font-size:12.5px;
}
.bulk-action-bar button{
  background:var(--red);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;
}
.bulk-action-bar button:disabled{opacity:.4;cursor:not-allowed;}
.avatar-chip.bulk-selected{border-color:var(--red);background:#FFF2F2;box-shadow:0 0 0 2px rgba(215,25,32,.25);}
.bulk-check{
  width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--red);
}
.avatar-chip.bulk-selected .bulk-check{background:var(--red);color:#fff;border-color:var(--red);}
.roster-group-section{margin-bottom:10px;}
.roster-group-header{
  display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--charcoal);
  margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid var(--border);
}
.rg-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.rg-count{background:var(--offwhite);color:var(--grey-txt);font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;margin-left:auto;}
.roster-group-grid{
  display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:6px;background:var(--offwhite);border:2px dashed var(--border);border-radius:7px;
}
.chip-dept-tag{
  font-size:7px;font-weight:800;padding:1px 4px;border-radius:4px;margin-left:2px;
}
.chip-dept-tag.direct{background:#1857A4;color:#fff;}
.chip-dept-tag.indirect{background:#C9631A;color:#fff;}
.chip-dept-tag.none{background:#B0B6BB;color:#fff;}
.avatar-chip.tiny{padding:1px 5px 1px 1px;border-radius:12px;}
.avatar-chip.tiny .avatar-circle{width:19px;height:19px;}
.avatar-chip.tiny .avatar-circle svg{width:12px;height:12px;}
.avatar-chip.tiny .aname{font-size:9px;}
.avatar-chip.assigned-instance{cursor:grab;}
.avatar-chip.assigned-instance:hover{background:#FFF2F2;border-color:var(--red);}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
  background:var(--charcoal-dk); color:#fff; padding:11px 20px; border-radius:9px;
  font-size:12.5px; font-weight:700; z-index:10000; box-shadow:0 8px 24px rgba(0,0,0,.35);
  opacity:0; transition:opacity .18s ease, transform .18s ease; pointer-events:none; max-width:88vw; text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast.warn{ background:var(--red); }
.toast.ok{ background:var(--green); }
#pool-tray-wrap.pool-drop-hover{outline:3px dashed var(--red);outline-offset:2px;background:#FFF6F6;border-radius:8px;}
#pool-tray-wrap.pool-drop-hover #roster-tray::after{content:"↩ ปล่อยตรงนี้เพื่อถอนออก / Drop here to unassign";
  display:block;text-align:center;padding:6px;font-size:11px;font-weight:800;color:var(--red);}
.chip-ghost-avatar{position:fixed;pointer-events:none;z-index:999;opacity:.92;transform:translate(-50%,-50%) scale(1.08);}
.avatar-chip.chip-dimmed{opacity:.4; filter:grayscale(60%);}
.avatar-chip.chip-relief{border-color:#E8A020; border-style:dashed; background:#FFF8EC; box-shadow:0 0 0 2px rgba(232,160,32,.25);}
.chip-tag{font-size:7.5px; font-weight:800; padding:1px 4px; border-radius:5px; background:#B0B6BB; color:#fff; margin-left:2px;}
.chip-tag.relief{background:#E8A020; color:#3A2405;}

.machine-icon-svg{width:100%;height:52px;display:block;margin:2px 0;}

.jig-tile{
  background:#FBBF24; border:2px solid #92400E; border-radius:5px; padding:3px 6px;
  font-size:9.5px; font-weight:800; color:#3A2405; text-align:center; cursor:grab; touch-action:none;
  min-width:56px; position:relative; box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.jig-tile.dragging{opacity:.35;}
.jig-tile .jstatus{position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;}
.jig-tray{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;background:var(--offwhite);border:2px dashed var(--border);border-radius:7px;}
.jig-slot{min-height:26px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:3px;}
.jig-slot.dragover{outline:2px dashed #92400E;border-radius:5px;}

.overview-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px;}
@media (max-width:800px){.overview-hero{grid-template-columns:1fr;}}
.hero-card{border-radius:10px;padding:18px;color:#fff;}
.hero-card.shortage{background:linear-gradient(135deg,#B5141A,#D71920);}
.hero-card.surplus{background:linear-gradient(135deg,#1E5631,#2E7D52);}
.hero-card.neutral{background:linear-gradient(135deg,var(--charcoal-dk),var(--charcoal));}
.hero-card .hn{font-family:var(--font-head);font-size:34px;font-weight:700;}
.hero-card .hl{font-size:12px;opacity:.9;margin-top:2px;}
.zone-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:#fff;}
.zone-req-table{width:100%;min-width:640px;border-collapse:collapse;background:#fff;font-size:12.5px;table-layout:fixed;}
.zone-req-table th{background:var(--charcoal);color:#fff;padding:8px 10px;text-align:center;}
.zone-req-table th:first-child{text-align:left;}
.zone-req-table td{padding:7px 10px;border-top:1px solid var(--border);text-align:center;}
.zone-req-table td:first-child{text-align:left;}
.zone-req-table th:nth-child(1),.zone-req-table td:nth-child(1){width:auto;}
.zone-req-table th:nth-child(2),.zone-req-table td:nth-child(2),
.zone-req-table th:nth-child(3),.zone-req-table td:nth-child(3){width:110px;}
.zone-req-table th:nth-child(4),.zone-req-table td:nth-child(4){width:130px;}
.zone-req-table td.num{text-align:center;font-weight:700;}
.gap-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
.gap-pill.short{background:#FBE2E3;color:var(--red);}
.gap-pill.ok{background:var(--green-bg);color:var(--green);}

.worker-panel-groups{display:flex;gap:8px;margin:10px 0;}
.wp-group-btn{flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);cursor:pointer;font-size:11.5px;font-weight:700;text-align:center;}
.wp-group-btn.active{border-color:currentColor;}
.wp-slot-tag{display:inline-flex;align-items:center;gap:6px;background:var(--offwhite);border-radius:6px;padding:4px 8px;font-size:11.5px;margin:3px 4px 0 0;}
.wp-slot-tag button{border:none;background:none;color:var(--red);font-weight:700;cursor:pointer;font-size:12px;}

/* ============================================================
   v4 — RBA ALERTS / REQUIREMENTS / SCENARIOS / TEAMS
   ============================================================ */
@keyframes rbaPulse{
  0%{box-shadow:0 0 0 0 rgba(215,25,32,.75);}
  70%{box-shadow:0 0 0 9px rgba(215,25,32,0);}
  100%{box-shadow:0 0 0 0 rgba(215,25,32,0);}
}
@keyframes rbaBlink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

.rba-alert{
  background:#FFF1F1; border:2px solid var(--red); border-left:8px solid var(--red);
  border-radius:10px; padding:14px 16px; margin-bottom:16px;
}
.rba-alert h3{
  margin:0 0 8px; font-family:var(--font-head); font-size:15px; color:var(--red);
  display:flex; align-items:center; gap:8px;
}
.rba-alert h3 .siren{font-size:19px; animation:rbaBlink 1s infinite;}
.rba-alert .rba-sub{font-size:12px;color:#7A2B2E;margin-bottom:10px;}
.rba-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:8px;max-height:290px;overflow-y:auto;}
.rba-item{
  background:#fff;border:1px solid #F2C3C5;border-radius:8px;padding:8px 10px;
  display:flex;align-items:center;gap:8px;font-size:12px;
}
.rba-item .rb-h{font-family:var(--font-head);font-weight:800;color:var(--red);font-size:15px;margin-left:auto;}
.rba-item .rb-why{font-size:10px;color:var(--grey-txt);}
.rba-ok-banner{
  background:var(--green-bg);border:1px solid var(--green);color:var(--green);
  border-radius:8px;padding:10px 14px;font-size:12.5px;font-weight:700;margin-bottom:16px;
}
.avatar-chip.rba-over{
  border-color:var(--red) !important; background:#FFEDED;
  box-shadow:0 0 0 2px rgba(215,25,32,.35);
}
.avatar-chip.rba-over .aname{color:var(--red);}
.rba-chip-flag{font-size:9px;font-weight:900;color:#fff;background:var(--red);border-radius:5px;padding:0 3px;margin-left:2px;}
.machine-tile.rba-warn{
  border-color:var(--red) !important;
  animation:rbaPulse 1.6s infinite;
}
.machine-tile .rba-tile-badge, .support-tile .rba-tile-badge{
  position:absolute; top:2px; left:2px; z-index:5;
  background:var(--red); color:#fff; font-size:9px; font-weight:900;
  border-radius:4px; padding:1px 4px; letter-spacing:.2px;
  animation:rbaBlink 1.1s infinite;
}
.support-tile.rba-warn{border-color:var(--red) !important; animation:rbaPulse 1.6s infinite;}

.req-line{
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:9px;font-weight:800;margin-top:2px;
}
.req-pill{border-radius:7px;padding:1px 6px;background:var(--green-bg);color:var(--green);}
.req-pill.short{background:#FBE2E3;color:var(--red);}
.req-pill.over{background:var(--amber-bg);color:var(--amber);}
.shift-col-lbl .req-mini{font-size:8px;font-weight:900;margin-left:3px;}
.shift-col-lbl .req-mini.short{color:var(--red);}
.shift-col-lbl .req-mini.ok{color:var(--green);}

.scenario-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#EEF2F5;border-bottom:1px solid var(--border);padding:8px 20px;font-size:12px;
}
.scenario-bar .sb-label{font-weight:800;font-family:var(--font-head);font-size:11.5px;color:var(--charcoal);}
.scenario-bar select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;min-width:190px;}
.scenario-bar button{
  padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;
  font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.scenario-bar button:hover{background:var(--charcoal);color:#fff;}
.scenario-bar button.primary{background:var(--green);color:#fff;border-color:var(--green);}
.scenario-bar button.danger{background:#fff;color:var(--red);border-color:#F0C2C4;}
.scenario-bar .sb-status{font-size:11px;color:var(--grey-txt);margin-left:auto;}

.team-row{
  border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:#fff;
}
.team-row .tr-top{display:flex;gap:6px;align-items:center;}
.team-row input[type=text]{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
.team-row .tr-bot{display:flex;gap:6px;align-items:center;margin-top:6px;}
.team-row select{flex:1;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;}
.team-row input[type=number]{width:66px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;}
.team-row .tr-del{border:none;background:none;color:var(--red);font-size:15px;font-weight:800;cursor:pointer;padding:2px 6px;}
.mini-lbl{font-size:10.5px;color:var(--grey-txt);font-weight:700;}
.ot-check{display:inline-flex;align-items:center;gap:2px;}
.ot-check input{transform:scale(.85);margin:0;}
.wwc-day.ot-off .otwrap input{opacity:.4;}
.wwc-day.rba-day-warn{background:#FFF4F4;}

/* ============================================================
   v5 — LAYOUT EDIT MODE / ALIGN TOOLS
   ============================================================ */
/* Cards are LOCKED by default so that dragging people is effortless.
   Double-click a card (or turn on layout mode) to move/resize it.     */
.region-item .region-drag-handle,
.region-item .region-resize-grip{ display:none; }
.region-item.editing .region-drag-handle,
.region-item.editing .region-resize-grip,
body.layout-edit .region-item .region-drag-handle,
body.layout-edit .region-item .region-resize-grip{ display:block; }

.region-item.editing{ outline:2px dashed var(--red); outline-offset:2px; }
.region-item.region-selected{ outline:3px solid #2C5E8A; outline-offset:2px; }
body.layout-edit .region-item{ cursor:move; }
body.layout-edit .avatar-chip,
body.layout-edit .jig-tile{ pointer-events:none; }
body.layout-edit .region-drag-handle{ background:var(--red); color:#fff; }

.layout-toolbar{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0;
  background:#fff; border:1px solid var(--border); border-radius:8px; padding:7px 10px;
}
.layout-toolbar.on{ border-color:var(--red); background:#FFF6F6; }
.layout-toolbar button{
  height:29px; padding:0 9px; border-radius:6px; border:1px solid var(--border); background:var(--offwhite);
  font-size:11.5px; font-weight:700; cursor:pointer; color:var(--charcoal); white-space:nowrap;
}
.layout-toolbar button:hover:not(:disabled){ background:var(--charcoal); color:#fff; }
.layout-toolbar button:disabled{ opacity:.35; cursor:not-allowed; }
.layout-toolbar button.on{ background:var(--red); color:#fff; border-color:var(--red); }
.layout-toolbar .lt-sep{ width:1px; height:22px; background:var(--border); }
.layout-toolbar .lt-note{ font-size:11px; color:var(--grey-txt); }
.layout-toolbar select,.layout-toolbar input[type=number]{
  height:29px; border:1px solid var(--border); border-radius:6px; font-size:11.5px; padding:0 6px;
}

/* ---------- Jig: free placement on a machine card ---------- */
.jig-layer{ position:absolute; inset:0; pointer-events:none; z-index:4; }
.jig-tile.free{ position:absolute; pointer-events:auto; z-index:4; }
.jig-tile .jname{ cursor:text; }
.jig-tile .jname:hover{ text-decoration:underline dotted; }
.jig-tile.dragover-host{ outline:2px dashed #92400E; }
.machine-tile.jig-target{ outline:2px dashed #92400E; outline-offset:2px; }

/* ---------- Break simulation ---------- */
.break-panel{ background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
.break-panel.on{ border-color:var(--red); box-shadow:0 0 0 2px rgba(215,25,32,.12); }
.break-panel h4{ margin:0 0 6px; font-family:var(--font-head); font-size:11.5px; text-transform:uppercase; color:var(--grey-txt); }
.bs-controls{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:7px; }
.bs-controls button{
  height:30px; padding:0 10px; border-radius:6px; border:none; background:var(--charcoal); color:#fff;
  font-size:11.5px; font-weight:700; cursor:pointer;
}
.bs-controls button.play{ background:var(--red); }
.bs-controls button.ghost{ background:var(--offwhite); color:var(--charcoal); border:1px solid var(--border); }
.bs-stat{ display:flex; justify-content:space-between; font-size:11px; padding:2px 0; border-bottom:1px dashed var(--border); }
.bs-stat b{ font-family:var(--font-head); }
.bs-stat.warn b{ color:var(--red); }
.bs-strip{ display:flex; gap:3px; flex-wrap:wrap; margin-top:7px; max-height:88px; overflow-y:auto; }
.bs-step{
  font-size:8.5px; font-weight:800; padding:2px 5px; border-radius:5px;
  background:var(--offwhite); color:var(--grey-txt); border:1px solid var(--border);
}
.bs-step.done{ background:#E7F3EC; color:var(--green); border-color:#B7DCC6; }
.bs-step.now{ background:var(--red); color:#fff; border-color:var(--red); animation:rbaBlink 1s infinite; }
.bs-round-tag{ font-size:9px;font-weight:800;color:#fff;background:#7C3AED;border-radius:5px;padding:1px 5px; }

.stop-overlay{
  position:absolute; inset:0; border:2.5px solid var(--red); border-radius:7px;
  background:repeating-linear-gradient(45deg, rgba(215,25,32,.12) 0 8px, rgba(215,25,32,.03) 8px 16px);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
  z-index:8; pointer-events:none;
}
.stop-overlay .sicon{ font-size:22px; line-height:1; animation:rbaBlink 1.1s infinite; }
.stop-overlay .stxt{
  font-size:8.5px; font-weight:900; color:#fff; background:var(--red);
  padding:1px 6px; border-radius:6px; text-align:center; max-width:96%;
}
.machine-tile.relief-now, .support-tile.relief-now{
  outline:3px solid #E8A020; outline-offset:1px;
}
.fly-avatar{
  position:fixed; z-index:9999; pointer-events:none; margin:0;
  transition:transform .8s cubic-bezier(.35,0,.2,1), opacity .8s ease;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.fly-trail{
  position:fixed; z-index:9998; pointer-events:none; height:3px; border-radius:2px;
  background:linear-gradient(90deg, rgba(232,160,32,0), #E8A020); transform-origin:0 50%;
  opacity:.85; transition:opacity .8s ease;
}

/* ---------- worker flags: pregnant / office ---------- */
.wflag{ font-size:9px; margin-left:1px; }
.avatar-chip.is-preg{ border-color:#D6336C; background:#FFF0F6; }
.avatar-chip.is-office{ border-color:#7C3AED; background:#F5F0FF; }
.avatar-chip.is-health{ border-color:#0C8599; background:#E7F8FA; }

/* ---- shared manpower ---- */
.share-pill{
  background:#E7F0FF; color:#1D4ED8; border-radius:7px; padding:1px 6px;
  font-size:9px; font-weight:800; white-space:nowrap;
}
.avatar-chip .share-frac{
  font-size:8.5px; font-weight:900; color:#fff; background:#1D4ED8;
  border-radius:5px; padding:0 3px; margin-left:2px;
}

(function(){

/* ============================================================

// Each machine: id, side(left/right), zone(A/B/C/R1/R2/R3), col order within its row
const MACHINES = [

// Support (non-machine) work zones — droppable, simpler (operator pool only)
// laborType: 'direct' = คนที่ผลิต/ประกอบชิ้นงานโดยตรง, 'indirect' = คนสนับสนุนการผลิต
const DEFAULT_SUPPORT_ZONES = [
  {id:'materialctrl2f', side:'L', label:'2nd Floor: Material Control', baseReq:4, banner:true, laborType:'indirect'},
  {id:'boxservice',  side:'L', label:'Box service',            baseReq:2, laborType:'indirect'},
  {id:'wip',         side:'R', label:'WIP',                    baseReq:0, laborType:'indirect'},
  {id:'secondpool',  side:'R', label:'2nd Process (ส่วนกลาง)', baseReq:3, isBreakPool:true, laborType:'direct'},

];

/* Teams/areas are editable at runtime: the list lives in state.supportZones.
   SZ() is the single accessor everything else must use. */
function SZ(){ return (state && state.supportZones) ? state.supportZones : DEFAULT_SUPPORT_ZONES; }
function findZone(id){ return SZ().find(z=>z.id===id) || null; }
function cloneDefaultZones(){ return DEFAULT_SUPPORT_ZONES.map(z=>({...z})); }

const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS_TH = ['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];
const DAY_LABELS_SHORT = ['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
const DAY_LABELS_SHORT_EN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// Hour model (RMT Connect style)
const BASE_HOURS_PER_SHIFT = 8.58; // 8h + 35min break counted as 0.58
const MAX_OT_PER_DAY = 4;
const RBA_WEEKLY_CAP = 60;

const BREAK_SLOTS_DEFAULT = [
  {id:'b1', label:'พักเบรกช่วงเช้า'},
  {id:'b2', label:'พักกลางวัน'},
  {id:'b3', label:'พักเบรกช่วงบ่าย'}
];

/* ============================================================
   BREAK GROUPS — 3 กลุ่มพัก (เขียว/ส้ม/เหลือง) พร้อมเวลาจริง
   จากบัตรพนักงาน "Part Manufacturing" ผลิต 1/2/3
   ============================================================ */
const BREAK_GROUPS = {
  green:  { id:'green',  label:'เบลก1', labelEn:'Break 1', color:'#2E7D52', bg:'#E7F3EC',
    day:   [{n:'1st time', s:'10:00', e:'10:10'}, {n:'2nd time', s:'11:00', e:'11:45'}, {n:'3rd time', s:'15:00', e:'15:10'}, {n:'OT time', s:'16:45', e:'17:10'}],
    night: [{n:'1st time', s:'22:00', e:'22:10'}, {n:'2nd time', s:'23:45', e:'00:30'}, {n:'3rd time', s:'03:00', e:'03:10'}, {n:'OT time', s:'05:05', e:'05:30'}]
  },
  orange: { id:'orange', label:'เบลก2', labelEn:'Break 2', color:'#C9631A', bg:'#FBEEE1',
    day:   [{n:'1st time', s:'10:10', e:'10:20'}, {n:'2nd time', s:'11:45', e:'12:30'}, {n:'3rd time', s:'15:10', e:'15:20'}, {n:'OT time', s:'17:10', e:'17:35'}],
    night: [{n:'1st time', s:'22:15', e:'22:25'}, {n:'2nd time', s:'00:35', e:'01:20'}, {n:'3rd time', s:'03:15', e:'03:25'}, {n:'OT time', s:'05:35', e:'06:00'}]
  },
  yellow: { id:'yellow', label:'เบลก3', labelEn:'Break 3', color:'#B8960C', bg:'#FBF6DE',
    day:   [{n:'1st time', s:'10:20', e:'10:30'}, {n:'2nd time', s:'12:30', e:'13:15'}, {n:'3rd time', s:'15:20', e:'15:30'}, {n:'OT time', s:'17:35', e:'18:00'}],
    night: [{n:'1st time', s:'22:30', e:'22:40'}, {n:'2nd time', s:'01:25', e:'02:10'}, {n:'3rd time', s:'03:30', e:'03:40'}, {n:'OT time', s:'06:05', e:'06:30'}]
  }
};
const BREAK_GROUP_ORDER = ['green','orange','yellow'];
const MAX_MACHINES_PER_WORKER = 4;

/* Special staff categories that change what a person may be scheduled for */
const WORKER_FLAGS = {
  none:        { id:'none',        emoji:'',   label:'ปกติ',              labelEn:'Normal' },
  pregnant:    { id:'pregnant',    emoji:'🤰', label:'ตั้งครรภ์',          labelEn:'Pregnant' },
  office:      { id:'office',      emoji:'💼', label:'ประจำออฟฟิศ',        labelEn:'Office-based' },
  healthissue: { id:'healthissue', emoji:'🩺', label:'มีปัญหาสุขภาพ',      labelEn:'Health issue' }
};
function workerFlag(w){ return (w && w.special && WORKER_FLAGS[w.special]) ? w.special : 'none'; }
function flagLabel(f){ const x = WORKER_FLAGS[f]; return !x ? '' : (state.lang==='en' ? x.labelEn : x.label); }
function isPregnant(w){ return workerFlag(w)==='pregnant'; }
function isOfficeStaff(w){ return workerFlag(w)==='office'; }
function hasHealthIssue(w){ return workerFlag(w)==='healthissue'; }
function countFlag(f){ return state.workers.filter(w=>workerFlag(w)===f).length; }
/* Pregnant staff may not work nights or overtime; office staff should not be
   standing at an injection machine. Everything found here is shown as an alert. */
function restrictionReport(){
  const out = [];
  state.workers.forEach(w=>{
    if(isPregnant(w)){
      const nightAt = (w.slots||[]).filter(sid=>isMachineSlot(sid) && machineNeedsNightShift(sid)
                        && effectiveShift(w, sid, state.weekStart)==='night');
      if(nightAt.length) out.push({ w, type:'preg-night', slots:nightAt,
        msg: T('ตั้งครรภ์ แต่ถูกจัดกะกลางคืน','Pregnant but scheduled on a night shift') });
      const r = state.roster[w.id];
      const otDays = r ? DAY_KEYS.filter(d=>r[d] && !r[d].off && r[d].otOn!==false && (parseFloat(r[d].ot)||0)>0) : [];
      if(otDays.length) out.push({ w, type:'preg-ot', slots:[],
        msg: T('ตั้งครรภ์ แต่ยังติ๊ก OT ไว้ '+otDays.length+' วัน','Pregnant but still has OT ticked on '+otDays.length+' day(s)') });
    }
    if(isOfficeStaff(w)){
      const machines = (w.slots||[]).filter(isMachineSlot);
      if(machines.length) out.push({ w, type:'office-machine', slots:machines,
        msg: T('เป็นพนักงานประจำออฟฟิศ แต่ถูกจัดยืนหน้าเครื่องฉีด','Office-based staff assigned to an injection machine') });
    }
    if(hasHealthIssue(w)){
      if(rbaOverSet.has(w.id)) out.push({ w, type:'health-rba', slots:w.slots||[],
        msg: T('มีปัญหาสุขภาพ และทำงานเกินเกณฑ์ RBA — ควรพิจารณาลดชั่วโมงทำงาน','Health issue, and currently exceeds the RBA hour limit — consider reducing hours') });
      const nightAt = (w.slots||[]).filter(sid=>isMachineSlot(sid) && machineNeedsNightShift(sid)
                        && effectiveShift(w, sid, state.weekStart)==='night');
      if(nightAt.length) out.push({ w, type:'health-night', slots:nightAt,
        msg: T('มีปัญหาสุขภาพ และถูกจัดกะกลางคืน — ควรตรวจสอบความเหมาะสม','Health issue, and scheduled on a night shift — please double-check') });
    }
  });
  return out;
}
function restrictionAlertHtml(){
  const rep = restrictionReport();
  const preg = countFlag('pregnant'), off = countFlag('office'), health = countFlag('healthissue');
  if(!rep.length && !preg && !off && !health) return '';
  return `
    <div class="restriction-alert">
      <h3>${WORKER_FLAGS.pregnant.emoji}${WORKER_FLAGS.office.emoji}${WORKER_FLAGS.healthissue.emoji} ${T('พนักงานที่มีข้อจำกัดพิเศษ','Staff with special restrictions')}</h3>
      <div class="ritem">${T('ตั้งครรภ์','Pregnant')}: <b>${preg}</b> ${T('คน','people')} — ${T('ห้ามกะกลางคืนและห้าม OT','no night shift, no overtime')} &nbsp;•&nbsp; ${T('ประจำออฟฟิศ','Office-based')}: <b>${off}</b> ${T('คน','people')} &nbsp;•&nbsp; ${T('มีปัญหาสุขภาพ','Health issue')}: <b>${health}</b> ${T('คน','people')}</div>
      ${rep.length ? rep.map(r=>`<div class="ritem" style="color:#D6336C;font-weight:700;">⚠ ${r.w.name}: ${r.msg}${r.slots.length?(' ('+r.slots.map(labelForSlot).join(', ')+')'):''}</div>`).join('')
                   : `<div class="ritem" style="color:var(--green);font-weight:700;">✓ ${T('ยังไม่พบการจัดกะที่ขัดกับข้อจำกัด','No scheduling conflicts found')}</div>`}
    </div>`;
}

/* ============================================================
   STATE + CALCULATIONS — v3
   ============================================================ */
let state = null;

const AVATAR_STYLES = ['m1','f1','m2','f2'];
const WORKER_COLOR_PALETTE = [
  '#4C6EF5','#F76707','#0CA678','#E64980','#7048E8','#1098AD',
  '#F59F00','#37B24D','#E03131','#5C7CFA','#12B886','#D6336C',
  '#845EF7','#228BE6','#F08C00','#2F9E44','#C2255C','#3B5BDB'
];

function initWorkers(){
  const sharedPairs = [['650T-1','850T-1'], ['350T-8','350T-7'], ['350T-6','350T-5'], ['350T-4','350T-2'],
                        ['180T-1','180T-2'], ['220T-1','220T-2'], ['450T-3','450T-4'],
                        ['350T-3','350T-1'], ['350T-9','350T-10'], ['180T-4','220T-4']];
  const covered = new Set();
  const groups = [];
  sharedPairs.forEach(pair=>{ groups.push(pair); pair.forEach(m=>covered.add(m)); });
  MACHINES.forEach(m=>{ if(!covered.has(m.id)) groups.push([m.id]); });

  const workers = [];
  let n = 1;
  function mk(slots, role){
    const id = 'W'+String(n).padStart(2,'0');
    const gcolor = BREAK_GROUP_ORDER[(n-1)%3];
    const avatar = AVATAR_STYLES[(n-1)%AVATAR_STYLES.length];
    const color = WORKER_COLOR_PALETTE[(n-1)%WORKER_COLOR_PALETTE.length];
    n++;
    workers.push({ id, name:id, slots: slots?slots.slice():[], role: role||'operator', breakGroup: gcolor, avatar, color, shiftAssign:{}, reliefFor:null, rotation:{enabled:false, anchorWeek:null, anchorShift:'day'} });
    return id;
  }
  groups.forEach((grp,idx)=>{
    if(idx < groups.length-2){ mk(grp, 'operator'); }
  });
  DEFAULT_SUPPORT_ZONES.forEach(z=>{
    const n2 = Math.max(0, z.baseReq - (z.baseReq>2?1:0));
    for(let i=0;i<n2;i++) mk([z.id], 'support');
  });
  for(let i=0;i<6;i++) mk([], 'operator');
  return workers;
}

function defaultProductionPlan(){
  const plan = {};
  MACHINES.forEach(m=>{
    plan[m.id] = {};
    DAY_KEYS.forEach(d=>{ plan[m.id][d] = (d==='sat'||d==='sun') ? 1 : 2; });
  });
  return plan;
}

function defaultMachineMeta(){
  const meta = {};
  MACHINES.forEach(m=>{ meta[m.id] = { decommission:{flag:false, note:'', date:''} }; });
  return meta;
}

function defaultLabels(zones){
  const machine = {}; MACHINES.forEach(m=>machine[m.id]=m.id);
  const zone = {...ZONE_LABELS};
  const support = {}; (zones||SZ()).forEach(z=>support[z.id]=z.label);
  return { machine, zone, support };
}

function defaultMachineZone(){
  const mz = {};
  MACHINES.forEach(m=>{ mz[m.id] = m.zone; });
  return mz;
}
function defaultBlockItems(){

/* ---------- per-machine manpower requirement (feature #3) ---------- */
function defaultMachineReq(){
  const r = {};
  MACHINES.forEach(m=>{ r[m.id] = { day:1, night:1 }; });
  return r;
}
function machineReq(id){
  if(!state.machineReq) state.machineReq = defaultMachineReq();
  if(!state.machineReq[id]) state.machineReq[id] = { day:1, night:1 };
  const r = state.machineReq[id];
  if(typeof r.day !== 'number' || isNaN(r.day)) r.day = 1;
  if(typeof r.night !== 'number' || isNaN(r.night)) r.night = 1;
  return r;
}
/* Headcount may be fractional: 1 operator looking after 2 machines = 0.5 each,
   3 machines = 0.33 each, 4 machines = 0.25 each.                             */
const REQ_RATIOS = [
  { machines:1, value:1,    label:'1:1' },
  { machines:2, value:0.5,  label:'1:2' },
  { machines:3, value:1/3,  label:'1:3' },
  { machines:4, value:0.25, label:'1:4' },
  { machines:5, value:0.2,  label:'1:5' },
  { machines:6, value:1/6,  label:'1:6' }
];
function fmtReq(n){
  const v = Number(n)||0;
  if(Math.abs(v - Math.round(v)) < 0.005) return String(Math.round(v));
  return (Math.round(v*100)/100).toFixed(2).replace(/0$/,'');
}
/* if the value matches "1 person : N machines", return that N */
function reqRatioOf(v){
  const hit = REQ_RATIOS.find(r=>Math.abs(r.value - v) < 0.02);
  return hit ? hit.machines : null;
}
function ratioTag(id){
  const r = machineReq(id);
  const n = reqRatioOf(r.day);
  return (n && n>1) ? ('1:'+n) : '';
}
function machineRequiredTotal(id){
  if(isDecommissioned(id)) return 0;
  const r = machineReq(id);
  return r.day + (machineNeedsNightShift(id) ? r.night : 0);
}

/* ---------- per-support-team requirement, with an optional night shift
   (mirrors machineReq/machineRequiredTotal, but the data lives on the
   zone object itself since teams are already stored in state) ---------- */
function supportReq(id){
  const z = findZone(id);
  if(!z) return { day:0, night:0 };
  if(typeof z.reqDay !== 'number' || isNaN(z.reqDay)) z.reqDay = Number(z.baseReq)||0;
  if(typeof z.reqNight !== 'number' || isNaN(z.reqNight)) z.reqNight = 0;
  if(typeof z.twoShift !== 'boolean') z.twoShift = false;
  return { day: z.reqDay, night: z.twoShift ? z.reqNight : 0 };
}
function supportNeedsNightShift(id){
  const z = findZone(id);
  return !!(z && z.twoShift);
}
function supportRequiredTotal(id){
  const r = supportReq(id);
  return r.day + r.night;
}
function supportReqLineInner(id){
  const have = effectiveAssigned(id);
  const need = supportRequiredTotal(id);
  const rq = supportReq(id);
  const cls = have < need - 0.001 ? 'short' : (have > need + 0.001 ? 'over' : '');
  const breakdown = supportNeedsNightShift(id) ? `<span style="color:var(--grey-txt);font-weight:700;">☀${fmtReq(rq.day)} 🌙${fmtReq(rq.night)}</span>` : '';
  return `<span class="req-pill ${cls}">👤 ${fmtReq(have)}/${fmtReq(need)}</span>${breakdown}`;
}
function updateSupportReqLine(tile, id){
  const line = tile.querySelector('.req-line');
  if(line) line.innerHTML = supportReqLineInner(id);
  tile.querySelectorAll('.shift-col-lbl[data-shift]').forEach(lbl=>{
    const sh = lbl.dataset.shift;
    const need = supportReq(id)[sh];
    const have = effectiveAssignedShift(id, sh);
    const mini = lbl.querySelector('.req-mini');
    if(mini){ mini.textContent = fmtReq(have)+'/'+fmtReq(need); mini.className = 'req-mini '+(have<need-0.001?'short':'ok'); }
  });
}

  // used to make every box creep smaller on each save.)

  }

      ? T('✓ บันทึกขึ้น Cloud แล้ว ('+count+' พื้นที่)','✓ Saved to Cloud ('+count+' areas)')

  });
}

/* migrate any state loaded from cloud/localStorage/older versions */
function migrateState(){
  if(!state) return;
  if(!Array.isArray(state.supportZones) || state.supportZones.length===0){
    state.supportZones = cloneDefaultZones();
  }
  if(!state.machineReq) state.machineReq = defaultMachineReq();
  MACHINES.forEach(m=>machineReq(m.id));
  if(state.defaultOT===undefined || state.defaultOT===null) state.defaultOT = 2;
  if(!state.labels) state.labels = defaultLabels(state.supportZones);
  if(!state.labels.support) state.labels.support = {};
  if(!state.zoneColors) state.zoneColors = defaultZoneColors(state.supportZones);
  if(!state.zoneColors.support) state.zoneColors.support = {};
  state.supportZones.forEach(z=>{
    if(!state.labels.support[z.id]) state.labels.support[z.id] = z.label;
    if(!state.zoneColors.support[z.id]) state.zoneColors.support[z.id] = '#E9F3EA';
    if(typeof z.baseReq !== 'number') z.baseReq = Number(z.baseReq)||0;
    supportReq(z.id);   // lazy-inits reqDay/reqNight/twoShift from baseReq the first time
  });
  if(!state.blockItems) state.blockItems = defaultBlockItems();
  if(!state.regionPos) state.regionPos = defaultRegionPos();
  if(!Array.isArray(state.regionZOrder)) state.regionZOrder = allRegionKeysDefault();
  if(!Array.isArray(state.customAreas)) state.customAreas = [];
  if(!state.roster) state.roster = {};
  if(state.scenarioName===undefined) state.scenarioName = '';
  state.workers.forEach(w=>{ if(!w.special) w.special = 'none'; });
  if(Array.isArray(state.jigs)) state.jigs.forEach(j=>{ if(typeof j.req !== 'number') j.req = 1; });
  if(!state.rosterFilterTeam) state.rosterFilterTeam = 'all';
  if(!Array.isArray(state.selectedRegions)) state.selectedRegions = [];
  if(state.editingRegion===undefined) state.editingRegion = null;
  if(!state.snapGrid) state.snapGrid = 10;
  if(!state.breakSim) state.breakSim = { active:false, round:-1, playing:false };
  state.breakSim.playing = false; state.breakSim.timer = null;
  if(typeof state.breakSim.round !== 'number') state.breakSim.round = -1;
}

/* ---------- derived ---------- */
function isMachineSlot(id){ return MACHINES.some(m=>m.id===id); }
/* A secondary jig is a real work position too: people can be assigned to it.
   Its slot id is "jig:<jigId>" so it never collides with a machine or team id. */
function isJigSlot(id){ return typeof id==='string' && id.indexOf('jig:')===0; }
function jigIdOfSlot(id){ return isJigSlot(id) ? id.slice(4) : null; }
function jigSlotId(jigId){ return 'jig:'+jigId; }
function findJig(jigId){ return state.jigs.find(j=>j.id===jigId) || null; }
function jigOfSlot(id){ return isJigSlot(id) ? findJig(jigIdOfSlot(id)) : null; }
function jigReq(jigId){
  const j = findJig(jigId);
  if(!j) return 0;
  if(typeof j.req !== 'number' || isNaN(j.req)) j.req = 1;
  return j.req;
}
/* jigs that are actually installed somewhere and therefore need manning */
function activeJigs(){ return state.jigs.filter(j=>j.machineId); }
function isDecommissioned(machineId){ return state.machineMeta[machineId].decommission.flag; }
function machineWeeklyShiftTotal(machineId){
  if(isDecommissioned(machineId)) return 0;
  return DAY_KEYS.reduce((a,d)=>a+state.plan[machineId][d],0);
}
function operatorsFor(machineId){ return state.workers.filter(w=>w.slots.includes(machineId)); }
function workersCoveringSlot(slotId){ return state.workers.filter(w=>w.slots.includes(slotId)); }
function machineStatus(machineId){
  if(isDecommissioned(machineId)) return 'decommissioned';
  const ops = operatorsFor(machineId);
  if(ops.length===0) return 'critical';
  const sharedAny = ops.some(w=>w.slots.length>1);
  return sharedAny ? 'shared' : 'ok';
}
/* ---------- shared manpower ---------- */
/* every production position a person stands at (machines + secondary jigs) */
function productionSlotsOf(w){
  return (w.slots||[]).filter(sid=>isMachineSlot(sid) || isJigSlot(sid));
}
/* how much of one person this position actually gets */
function workerShareOn(w, slotId){
  if(!w) return 0;
  if(!isMachineSlot(slotId) && !isJigSlot(slotId)) return 1;   // support teams are not shared
  const n = productionSlotsOf(w).length;
  return n > 0 ? 1/n : 0;
}
function isSharedWorker(w){ return productionSlotsOf(w).length > 1; }
/* light up every position this person is covering, so "shared manpower"
   is visible at a glance instead of looking like double-counted headcount */
function highlightSharedWorker(workerId, on){
  document.querySelectorAll('.share-linked').forEach(el=>el.classList.remove('share-linked'));
  document.querySelectorAll('.share-linked-tile').forEach(el=>{
    el.classList.remove('share-linked-tile');
    const b = el.querySelector('.share-here-badge');
    if(b) b.remove();
  });
  if(!on) return;
  const w = state.workers.find(x=>x.id===workerId);
  if(!w) return;
  const total = productionSlotsOf(w).length;
  document.querySelectorAll('.avatar-chip.assigned-instance[data-worker-id="'+workerId+'"]').forEach(chip=>{
    chip.classList.add('share-linked');
    const tile = chip.closest('.machine-tile,.support-tile');
    if(tile && !tile.classList.contains('share-linked-tile')){
      tile.classList.add('share-linked-tile');
      const badge = document.createElement('div');
      badge.className = 'share-here-badge';
      badge.textContent = '🔗 1/' + total;
      tile.appendChild(badge);
    }
  });
}
/* headcount expressed in man-equivalents rather than bodies */
function effectiveAssigned(slotId){
  return workersCoveringSlot(slotId).reduce((a,w)=>a+workerShareOn(w,slotId), 0);
}
function effectiveAssignedShift(slotId, shift){
  return operatorsForShift(slotId, shift).reduce((a,w)=>a+workerShareOn(w,slotId), 0);
}
/* who else is this person covering right now? */
function sharedPartnersOf(w, slotId){
  return productionSlotsOf(w).filter(s=>s!==slotId);
}
function sharePercentLabel(w, slotId){
  const n = productionSlotsOf(w).length;
  if(n <= 1) return '';
  return '1/' + n;
}

function jigsFor(machineId){ return state.jigs.filter(j=>j.machineId===machineId); }
function unplacedJigs(){ return state.jigs.filter(j=>j.machineId===null); }
function slotLaborType(slotId){
  if(isMachineSlot(slotId)) return 'direct';
  if(isJigSlot(slotId)) return 'direct';
  const z = findZone(slotId);
  return z ? z.laborType : null;
}
/* used by the "filter by department/team" dropdown on the Floor Plan tray */
function workerMatchesTeamFilter(w, val){
  if(!val || val==='all') return true;
  if(val==='unassigned') return !w.slots || w.slots.length===0;
  if(val.indexOf('zone:')===0){
    const zk = val.slice(5);
    return (w.slots||[]).some(s=> isMachineSlot(s) && state.machineZone[s]===zk);
  }
  if(val.indexOf('support:')===0){
    const id = val.slice(8);
    return (w.slots||[]).includes(id);
  }
  return true;
}
function teamFilterOptionsHtml(){
  const zoneKeys = ['A','B','C','R1','R2','R3'].filter(zk=>MACHINES.some(m=>state.machineZone[m.id]===zk));
  const zonesHtml = zoneKeys.map(zk=>`<option value="zone:${zk}" ${state.rosterFilterTeam==='zone:'+zk?'selected':''}>${state.labels.zone[zk]}</option>`).join('');
  const teamsHtml = SZ().map(z=>`<option value="support:${z.id}" ${state.rosterFilterTeam==='support:'+z.id?'selected':''}>${state.labels.support[z.id]||z.label}</option>`).join('');
  return `

    <optgroup label="${T('ทีมสนับสนุน','Support teams')}">${teamsHtml}</optgroup>
    <option value="unassigned">${T('ยังไม่จัดตำแหน่ง','Unassigned')}</option>
  `;

function workerLaborType(w){
  if(isOfficeStaff(w)) return 'indirect';
  if(!w.slots || w.slots.length===0) return null;
  // if covering any machine, count as direct
  if(w.slots.some(s=>isMachineSlot(s))) return 'direct';
  const types = w.slots.map(slotLaborType).filter(Boolean);
  if(types.includes('direct')) return 'direct';
  if(types.length) return types[0];
  return null;
}
function laborTypeCounts(){
  const counts = { direct:0, indirect:0, unassigned:0 };
  state.workers.forEach(w=>{
    const t = workerLaborType(w);
    if(t==='direct') counts.direct++;
    else if(t==='indirect') counts.indirect++;
    else counts.unassigned++;
  });
  return counts;
}

function addSlotToWorker(workerId, slotId, shift){
  const w = state.workers.find(x=>x.id===workerId);
  if(!w) return { ok:false, reason:'nobody' };
  if(!w.shiftAssign) w.shiftAssign = {};
  if(w.slots.includes(slotId)){
    if(shift){ w.shiftAssign[slotId]=shift; reanchorRotation(w, shift); }
    return { ok:true, reason:'shift-changed' };
  }
  const isSupport = SZ().some(z=>z.id===slotId);
  if(isSupport){ w.slots = [slotId]; w.shiftAssign = { [slotId]: shift || 'day' }; reanchorRotation(w, shift || 'day'); return { ok:true }; }
  w.slots = w.slots.filter(s=>!SZ().some(z=>z.id===s));
  if(productionSlotsOf(w).length>=MAX_MACHINES_PER_WORKER) return { ok:false, reason:'max', worker:w };
  w.slots.push(slotId);
  w.shiftAssign[slotId] = shift || 'day';
  reanchorRotation(w, shift || 'day');
  return { ok:true };
}
/* central place so every assignment path gives the same feedback */
function reportAssignResult(res){
  if(!res || res.ok) return true;
  if(res.reason === 'max'){
    showToast(T(
      res.worker.name+' ดูแลอยู่แล้ว '+MAX_MACHINES_PER_WORKER+' เครื่อง (สูงสุด) — ต้องลากออกจากเครื่องเดิมก่อน',
      res.worker.name+' already covers '+MAX_MACHINES_PER_WORKER+' machines (the maximum) — drag them off one first'
    ), 'warn');
  }
  return false;
}
function reanchorRotation(worker, shiftJustSet){
  // Manual shift assignment always wins for the current week; keep rotating forward from here.
  if(worker.rotation && worker.rotation.enabled){
    worker.rotation.anchorWeek = state.weekStart;
    worker.rotation.anchorShift = shiftJustSet;
  }
}
function removeSlotFromWorker(workerId, slotId){
  const w = state.workers.find(x=>x.id===workerId);
  if(!w) return;
  w.slots = w.slots.filter(s=>s!==slotId);
  if(w.shiftAssign) delete w.shiftAssign[slotId];
}
function machineNeedsNightShift(machineId){
  if(isDecommissioned(machineId)) return false;
  return DAY_KEYS.some(d=>state.plan[machineId][d]===2);
}
function weeksBetween(dateStrA, dateStrB){
  const a = parseDateLocalSafe(dateStrA), b = parseDateLocalSafe(dateStrB);
  if(!a || !b) return 0;
  const msPerWeek = 7*24*60*60*1000;
  return Math.floor((b-a)/msPerWeek);
}
function parseDateLocalSafe(s){
  if(!s) return null;
  const parts = String(s).split('-').map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return null;
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function effectiveShift(worker, machineId, weekStr){
  const base = (worker.shiftAssign && worker.shiftAssign[machineId]) || 'day';
  const rot = worker.rotation;
  if(!rot || !rot.enabled || !rot.anchorWeek) return base;
  const wk = weeksBetween(rot.anchorWeek, weekStr || rot.anchorWeek);
  // every 2-week block flips; block 0 = anchorShift, block 1 = flipped, block -1 = flipped, block -2 = anchorShift, ...
  const block = Math.floor(wk/2);
  const flip = ((block % 2) + 2) % 2 === 1;
  return flip ? (rot.anchorShift==='day'?'night':'day') : rot.anchorShift;
}
function operatorsForShift(machineId, shift){
  return state.workers.filter(w=>w.slots.includes(machineId) && effectiveShift(w, machineId, state.weekStart)===shift);
}
function machineRequiresSaturdayOT(machineId){
  if(isDecommissioned(machineId)) return false;
  return state.plan[machineId]['sat'] > 0;
}

/* ============================================================
   BREAK ROTATION SIMULATION  (no buffer staff — people swap around)
   ============================================================ */
function breakSim(){
  if(!state.breakSim) state.breakSim = { active:false, round:-1, playing:false };
  return state.breakSim;
}
function breakOnGroup(){
  const b = breakSim();
  return (b.active && b.round>=0 && b.round<BREAK_GROUP_ORDER.length) ? BREAK_GROUP_ORDER[b.round] : null;
}
/* who actually walks over to cover a machine while group `g` is on break */
function reliefsForGroup(g){
  if(!g) return [];
  const out = [];
  state.workers.forEach(w=>{
    if(!w.reliefFor) return;
    if(w.breakGroup === g) return;                       // the reliever is on break too
    const target = w.reliefFor;
    const regulars = workersCoveringSlot(target);
    const anyAway = regulars.some(o=>o.breakGroup === g);
    if(!anyAway) return;                                 // nobody left that machine, no need
    const stillThere = regulars.some(o=>o.breakGroup !== g);
    if(stillThere) return;                               // somebody is still running it
    out.push({ w, from: (w.slots && w.slots[0]) || null, to: target });
  });
  return out;
}
/* people physically standing at `slotId` right now */
function occupantsDuring(slotId, g){
  if(!g) return workersCoveringSlot(slotId);
  const reliefs = reliefsForGroup(g);
  let list = workersCoveringSlot(slotId).filter(w=>w.breakGroup !== g);
  list = list.filter(w=>!reliefs.some(r=>r.w.id===w.id && r.from===slotId));
  reliefs.forEach(r=>{ if(r.to===slotId && !list.some(x=>x.id===r.w.id)) list.push(r.w); });
  return list;
}
function isOnBreakNow(w){ const g = breakOnGroup(); return !!g && w.breakGroup===g; }
function isLeavingForRelief(w, slotId){
  const g = breakOnGroup();
  if(!g) return false;
  return reliefsForGroup(g).some(r=>r.w.id===w.id && r.from===slotId);
}
/* everything that goes dark during a round */
function roundImpact(g){
  const reliefs = reliefsForGroup(g);
  const stoppedMachines = [];
  MACHINES.forEach(m=>{
    if(isDecommissioned(m.id)) return;
    const normally = workersCoveringSlot(m.id).length;
    if(normally === 0) return;                            // already flagged as "no operator"
    if(occupantsDuring(m.id, g).length === 0) stoppedMachines.push(m.id);
  });
  const emptyAreas = [];
  SZ().forEach(z=>{
    const normally = workersCoveringSlot(z.id).length;
    if(normally === 0) return;
    if(occupantsDuring(z.id, g).length === 0) emptyAreas.push(z.id);
  });
  return { group:g, reliefs, stoppedMachines, emptyAreas };
}
function breakRotationPlan(){ return BREAK_GROUP_ORDER.map(g=>roundImpact(g)); }

/* ---------- flying-avatar animation ---------- */
function flyAvatar(fromRect, toRect, chipEl){
  if(!fromRect || !toRect) return;
  const ghost = chipEl.cloneNode(true);
  ghost.classList.add('fly-avatar');
  ghost.style.left = fromRect.left+'px';
  ghost.style.top  = fromRect.top+'px';
  ghost.style.width = Math.max(fromRect.width, 40)+'px';
  document.body.appendChild(ghost);
  const dx = toRect.left - fromRect.left, dy = toRect.top - fromRect.top;
  // trail
  const trail = document.createElement('div');
  trail.className = 'fly-trail';
  const len = Math.hypot(dx,dy), ang = Math.atan2(dy,dx)*180/Math.PI;
  trail.style.left = (fromRect.left+fromRect.width/2)+'px';
  trail.style.top  = (fromRect.top+fromRect.height/2)+'px';
  trail.style.width = len+'px';
  trail.style.transform = 'rotate('+ang+'deg)';
  document.body.appendChild(trail);
  ghost.getBoundingClientRect();
  requestAnimationFrame(()=>{ ghost.style.transform = 'translate('+dx+'px,'+dy+'px) scale(1.15)'; });
  setTimeout(()=>{ ghost.style.opacity='0'; trail.style.opacity='0'; }, 720);
  setTimeout(()=>{ ghost.remove(); trail.remove(); }, 1150);
}
function captureChipRects(){
  const map = {};
  document.querySelectorAll('#tab-floor .region-item .avatar-chip').forEach(el=>{
    const id = el.dataset.workerId;
    if(!map[id]) map[id] = el.getBoundingClientRect();
  });
  return map;
}
function goToBreakRound(r, animate){
  const b = breakSim();
  const before = animate ? captureChipRects() : null;
  b.active = r >= 0;
  b.round  = r;
  state.breakModeActive = b.active;
  refreshFloorAssignments();
  renderBreakPanel();
  if(animate && before){
    document.querySelectorAll('#tab-floor .avatar-chip.chip-relief').forEach(el=>{
      const id = el.dataset.workerId;
      flyAvatar(before[id], el.getBoundingClientRect(), el);
    });
  }
}
function stopBreakSim(){
  const b = breakSim();
  b.active = false; b.round = -1; b.playing = false;
  if(b.timer){ clearInterval(b.timer); b.timer = null; }
  state.breakModeActive = false;
  refreshFloorAssignments();
  renderBreakPanel();
}
function nextBreakRound(animate){
  const b = breakSim();
  const next = (b.round + 1) % BREAK_GROUP_ORDER.length;
  goToBreakRound(next, animate !== false);
}
function togglePlayBreak(){
  const b = breakSim();
  if(b.playing){ b.playing = false; if(b.timer){ clearInterval(b.timer); b.timer=null; } renderBreakPanel(); return; }
  b.playing = true;
  if(b.round < 0) goToBreakRound(0, true); else nextBreakRound(true);
  b.timer = setInterval(()=>{ if(!breakSim().playing){ clearInterval(breakSim().timer); return; } nextBreakRound(true); }, 2600);
  renderBreakPanel();
}

/* ============================================================
   RBA WORKING-HOUR ENGINE (feature #6 + #7)
   ============================================================ */
function effectiveOT(day, w){
  if(!day || day.off) return 0;
  if(w && isPregnant(w)) return 0;          // pregnant staff may not work overtime
  if(day.otOn === false) return 0;
  const v = parseFloat(day.ot);
  return isNaN(v) ? 0 : v;
}
function workerWeeklyHours(w){
  const roster = getRosterFor(w.id);
  let total = 0, otTotal = 0, offDays = 0, workDays = 0;
  DAY_KEYS.forEach(d=>{
    const day = roster[d];
    if(day.off){ offDays++; return; }
    const ot = effectiveOT(day, w);
    total += BASE_HOURS_PER_SHIFT + ot;
    otTotal += ot;
    workDays++;
  });
  return { total, otTotal, offDays, workDays };
}
/* Returns every scheduled worker that breaks an RBA rule:
   - more than 60 h in the week
   - no rest day at all in the 7-day window                     */
function rbaReport(){
  const out = [];
  state.workers.forEach(w=>{
    if(!w.slots || w.slots.length===0) return;
    const h = workerWeeklyHours(w);
    const overCap = h.total > RBA_WEEKLY_CAP + 0.001;
    const noRest  = h.offDays === 0;
    if(overCap || noRest) out.push({ w, ...h, overCap, noRest });
  });
  out.sort((a,b)=>b.total-a.total);
  return out;
}
let rbaOverSet = new Set();
function refreshRbaSet(){
  rbaOverSet = new Set(rbaReport().map(r=>r.w.id));
  return rbaOverSet;
}
function rbaReasonText(r){
  const parts = [];
  if(r.overCap) parts.push(T('เกิน '+RBA_WEEKLY_CAP+' ชม./สัปดาห์','over '+RBA_WEEKLY_CAP+'h/week'));
  if(r.noRest)  parts.push(T('ไม่มีวันหยุดใน 7 วัน','no rest day in 7 days'));
  return parts.join(' • ');
}
function rbaAlertHtml(){
  const report = rbaReport();
  if(report.length===0){
    return `<div class="rba-ok-banner">✓ ${T('ไม่มีพนักงานทำงานเกินเกณฑ์ RBA ('+RBA_WEEKLY_CAP+' ชม./สัปดาห์ และมีวันหยุดครบ)','No employee exceeds the RBA limits ('+RBA_WEEKLY_CAP+'h/week, rest day present)')}</div>`;
  }
  return `
    <div class="rba-alert">
      <h3><span class="siren">🚨</span> ${T('แจ้งเตือน: พนักงาน '+report.length+' คน ทำงานเกินเกณฑ์ RBA','Alert: '+report.length+' employee(s) exceed RBA limits')}</h3>
      <div class="rba-sub">${T('เกณฑ์: ไม่เกิน '+RBA_WEEKLY_CAP+' ชั่วโมง/สัปดาห์ (รวม OT) และต้องมีวันหยุดอย่างน้อย 1 วันใน 7 วัน — ปรับ OT/วันหยุดได้ที่แท็บ "ตารางเวลาทำงาน"','Limits: max '+RBA_WEEKLY_CAP+'h/week including OT, and at least 1 rest day per 7 days — adjust OT/rest days in the "Work Hours Roster" tab')}</div>
      <div class="rba-list">
        ${report.slice(0,12).map(r=>`
          <div class="rba-item">
            <span class="avatar-circle" style="width:24px;height:24px;background:${r.w.color};border-color:var(--red);">${avatarSvg(r.w.avatar)}</span>
            <span>
              <b>${r.w.name}</b><br>
              <span class="rb-why">${r.w.slots.map(labelForSlot).join(', ')}</span><br>
              <span class="rb-why" style="color:var(--red);font-weight:700;">${rbaReasonText(r)}</span>
            </span>
            <span class="rb-h">${r.total.toFixed(1)}h</span>
          </div>`).join('')}
      </div>
      ${report.length>12 ? `<div class="rba-sub" style="margin:8px 0 0;font-weight:700;">${T('…และอีก '+(report.length-12)+' คน — ดูรายชื่อทั้งหมดที่แท็บ “ตารางเวลาทำงาน”','…and '+(report.length-12)+' more — see the full list in the “Work Hours Roster” tab')}</div>` : ''}
    </div>`;
}

/* ---------- overview / summary ---------- */
function zoneRequirement(){
  const rows = [];
  ['A','B','C','R1','R2','R3'].forEach(zk=>{
    const ids = MACHINES.filter(m=>state.machineZone[m.id]===zk && !isDecommissioned(m.id)).map(m=>m.id);
    if(ids.length===0) return;
    let required = 0, assigned = 0;
    ids.forEach(id=>{ required += machineRequiredTotal(id); assigned += effectiveAssigned(id); });
    assigned = Math.round(assigned*100)/100;
    rows.push({ key:zk, label: state.labels.zone[zk], type:'zone', laborType:'direct',
                required, assigned, gap: required - assigned, machines: ids.length });
  });
  const jigs = activeJigs();
  if(jigs.length){
    let required = 0, assigned = 0;
    jigs.forEach(j=>{ required += jigReq(j.id); assigned += effectiveAssigned(jigSlotId(j.id)); });
    required = Math.round(required*100)/100;
    assigned = Math.round(assigned*100)/100;
    rows.push({ key:'__jigs', label: T('Secondary Process (2nd Jig)','Secondary Process (2nd Jig)'), type:'jig',
                laborType:'direct', required, assigned, gap: required-assigned, machines: jigs.length });
  }
  SZ().forEach(z=>{
    const required = supportRequiredTotal(z.id);
    const assigned = Math.round(effectiveAssigned(z.id)*100)/100;
    rows.push({ key:z.id, label: state.labels.support[z.id]||z.label, type:'support', laborType:z.laborType,
                required, assigned, gap: required-assigned });
  });
  return rows;
}
function overviewSummary(){
  const rows = zoneRequirement();
  const totalRequired = Math.round(rows.reduce((a,r)=>a+r.required,0)*100)/100;
  const totalWorkers = state.workers.length;
  const shortage = Math.round(Math.max(0, totalRequired - totalWorkers)*100)/100;
  const surplus = Math.round(Math.max(0, totalWorkers - totalRequired)*100)/100;
  return { rows, totalRequired, totalWorkers, shortage, surplus };
}

/* Small transient message so a rejected/blocked action is never silent. */
let toastTimer = null, toastEl = null;
function showToast(msg, kind){
  if(!toastEl){
    toastEl = document.createElement('div');
    document.body.appendChild(toastEl);
  }
  toastEl.className = 'toast' + (kind ? ' '+kind : '');
  toastEl.textContent = msg;
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ if(toastEl) toastEl.classList.remove('show'); }, 2600);
}

   EDITABLE LABEL HELPER
   ============================================================ */
function editableLabel(getVal, setVal, extraStyle){
  const span = document.createElement('span');
  span.className = 'editable-label';
  if(extraStyle) span.style.cssText = extraStyle;
  span.textContent = getVal();
  span.title = T('คลิกเพื่อแก้ไข','Click to edit');
  span.addEventListener('click', (e)=>{
    e.stopPropagation();
    const input = document.createElement('input');
    input.type='text'; input.value = getVal();
    span.replaceWith(input);
    input.focus(); input.select();
    function commit(){
      setVal(input.value.trim() || getVal());
      input.replaceWith(span);
      span.textContent = getVal();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') input.blur(); if(ev.key==='Escape'){ input.value=getVal(); input.blur(); } });
    input.addEventListener('click', ev=>ev.stopPropagation());
  });
  return span;
}
